id: arfid
title: ARFID and feeding disorders
summary: Avoidant/restrictive intake is not a body-image eating disorder. Medical risk, autism, GI illness, and the cultural meaning of food all change the work.
group: Gastroenterology
order: 80
completeness: stub
statusBadge: Draft - pending medical team review
reviewer: ""
reviewDate: ""
systems: Gastroenterology, Feeding
trainingIds: feeding
---

## Overview

Stub for medical team review. Avoidant/restrictive food intake disorder is a pattern of limited eating with nutritional, growth, or psychosocial consequences, without the body-image fear that defines anorexia nervosa. Pediatric feeding disorders overlap and are often the better frame in young children, especially with skill, medical, or developmental contributors. Speech, GI, dietitian, and sometimes OT are already in the case. Do not start a food hierarchy that ignores them.

What the medical team still needs to add: your malnutrition thresholds, tube-feeding philosophy, and which foods or textures are off-limits until swallow safety is cleared.

## Key treatments

Medical stabilization and nutrition come first. Psychological treatment is often a form of CBT adapted for ARFID, family-based work, or caregiver coaching at meals, matched to age. Feeding therapy addresses skill and texture. Medicines are sometimes used for appetite or anxiety. The team chooses. You do not set calorie targets.

## Treatment burden

Meals become a battlefield. One caregiver is the "only one who can feed them." Family restaurants, holidays, and cultural foods drop out. Tube feeds, if present, bring relief and grief at the same time. Siblings eat differently and notice.

## Adherence

Pressure, bribes, and long sit-times usually make the range smaller. Families have been told opposite things by different clinicians. Ask what they were praised for and what they were scolded for. A plan that removes a culturally important food without asking will not be kept, and should not be written.

## Mental health and development

Anxiety, sensory sensitivity, autism, and GI pain are common companions. ARFID is not "picky eating" as an insult, and it is not a failure of parenting. Young children need caregiver-delivered interventions. School-age children can join a small ladder. Adolescents may also have, or be developing, body-image concerns. Reassess. Do not assume the diagnosis is frozen.

## Long-term effects

Growth faltering, micronutrient deficiency, low bone density, and, for some, lasting tube dependence or social exclusion around food. The dietitian tracks the body. You track fear, family meals, and function.

## Red flags

- Fainting, chest pain, dizziness, refusal of all fluids, rapid weight loss, or a caregiver report that the child has stopped drinking. Medical assessment now.
- Swallowing cough, choking, or a food texture speech has not cleared.
- Suicidal ideation or a coexisting body-image eating disorder with medical instability.
- Do not recommend a cleanse, an appetite supplement, or a fast.

## Therapy implications

### Individual

Build from foods that are already safe. One new food, or one new place to eat a safe food, is a full goal. Map fear: choking, vomiting, texture, novelty, or social exposure. Keep body weight out of motivational speeches.

### Family

Lower pressure at the table. One adult voice. Protect cultural foods and family meals even if the child's plate stays narrow. Ask who is exhausted and whether meals have destroyed dinner for everyone else.

### Parent training

Short meals, no force-feeding, praise for sitting or tasting if that is the step, and a planned end. Coach the adult who actually feeds the child. If a tube exists, follow the nutrition plan for what "success" means. Coming off a tube is not your unilateral goal.

## Intake questions

- What is eaten and drunk on a usual day, and what was cleared by speech or GI?
- Is there choking fear, vomiting fear, sensory refusal, low appetite, or a body-image drive? More than one can be true.
- What happens at the table in the ten minutes after a refusal?
- Which foods matter to this family's culture that a plan must not casually drop?
- Any autism, GI diagnosis, or tube?

## Differentials

- ARFID versus anorexia nervosa versus both. Ask about body image directly, in developmentally possible language.
- Food refusal versus pain, constipation, eosinophilic disease, or a swallowing problem.
- "Behavior at meals" versus a feeding skill delay or a sensory pattern OT already described.
- Cultural food practices versus a disorder. A narrow menu that meets nutrition and does not impair the child is not ARFID.

## Modifications

- Do not use snacks as rewards if food is the fear.
- Do not expand textures past the speech or GI clearance.
- Include the feeding therapist's current step so you do not contradict it.
- Use the feeding and cultural-eating training before you improvise a hierarchy.

## Sources

- [National Eating Disorders Association — ARFID](https://www.nationaleatingdisorders.org/avoidant-restrictive-food-intake-disorder-arfid/) — Plain-language description of ARFID and how it differs from other eating disorders.
- [NIDDK — feeding and GI health context](https://www.niddk.nih.gov/health-information/digestive-diseases) — Starting point for digestive conditions that travel with feeding problems. Use the specific disease page once the diagnosis is known.
- [American Academy of Pediatrics](https://www.aap.org/) — Pediatric context for growth and feeding. Confirm local dietitian targets before you teach numbers.

id: autism-genetic
title: Autism and genetic developmental disorders
summary: Autism is a developmental difference in the scope, not a single protocol. CSC does not provide high-hour ABA. Genetic diagnoses need their own medical facts.
group: Development
order: 130
completeness: stub
statusBadge: Draft - pending medical team review
reviewer: ""
reviewDate: ""
systems: Development

## Overview

Stub for medical team review. Autism is a difference in social communication and in restricted or repetitive patterns, with a wide range of language, learning, and support needs. The scope counts it as a developmental difference that can meet Condition B. It is not, by itself, a reason to enroll a child in CSC if there is no mental health or behavioral disorder and no other qualifying path. High-hour ABA is an excluded service even when autism is present.

Genetic developmental disorders are not one condition. Fragile X, Down syndrome, 22q11 deletion, and others have their own medical surveillance. This stub is a placeholder for that whole shelf. Do not give syndrome-specific medical advice from this card.

What the medical team still needs to add: which syndromes your clinic wants as separate cards, and the medical red flags for each.

## Key treatments

Communication support, school services, OT, speech, and sometimes an ABA program delivered by an ABA provider. Co-occurring ADHD, anxiety, sleep problems, and irritability may be treated with therapy and, when a prescriber chooses, medicine. CSC's formats are individual, family, and parent training at an ordinary outpatient dose. Ask what is already in place so you do not duplicate or contradict it.

## Treatment burden

Appointments, school meetings, and a caregiver who is translating the child to every new adult. Sleep loss is common. Families may have been offered only one model of help and told that anything else is giving up. Siblings get less. The child is often in rooms where people talk as if they were not there.

## Adherence

Visual schedules and caregiver strategies fail when they are too complex to do on a Tuesday, or when every provider hands over a different one. Ask what is actually on the fridge. A plan the child cannot perform at their language level is not a refused plan.

## Mental health and development

Anxiety, ADHD, depression, and disruptive behavior are common co-travelers and are often the CSC referral. Sensory load, change, and communication breakdown drive "behavior." Intellectual disability may or may not be present. Giftedness may or may not be present. Measure the child in front of you. Use the Ahead / Typical / Behind lens rather than the word autism as a dose instruction.

Girls and adolescents are under-recognized. Masking at school and meltdown at home is a common pattern, not a contradiction.

## Long-term effects

Support needs change at puberty and at the transition out of school services. Some children have co-occurring epilepsy, GI disease, or sleep disorders that need their own medical home. Mental health risk, including depression in adolescents, should be asked about directly in language the person can use.

## Red flags

- New regression, a new seizure pattern, a stop in eating or drinking, or self-injury that is injuring tissue. Medical team.
- Elopement that has become dangerous. Safety plan with the caregiver before you leave the visit.
- Suicidal ideation. Autistic adolescents can be missed because the wording is concrete or unusual. Ask anyway.
- A request for CSC to provide many hours a week of ABA. Say no, and help them find the right referral. That exclusion is in the scope.

## Therapy implications

### Individual

Use the child's communication system. Short and concrete beats insight-shaped talk if language or processing says so. Anxiety treatment can be adapted. Do not require eye contact as a goal. Interests are a way in, not a distraction to extinguish for its own sake.

### Family

Parents may be in conflict about the diagnosis or about ABA. Hear it. The scope still excludes high-hour programs from CSC. Caregiver stress and the need for one consistent home strategy are the family work.

### Parent training

One antecedent change and one replacement skill, matched to communication the child already has. Visuals and a caregiver who can do the plan on a bad day. This is the behavior-modification training used inside a therapy hour, not the start of an ABA program.

## Intake questions

- How does the child communicate when calm, and when upset?
- What services and hours are already in place? Is this a request for ABA hours?
- What is the one situation that most needs to change?
- Any genetic diagnosis, seizures, GI disease, or sleep disorder the medical team follows?
- What are the child's interests and skills? Start there as well as with the problem.

## Differentials

- Aggression or self-injury versus pain, constipation, dental pain, seizures, or a communication system that fails under stress.
- ADHD versus sensory overload versus anxiety versus absence seizures.
- A learning disability alone does not meet Condition B. Autism does. Do not swap the labels to qualify a referral.
- Demand avoidance versus a demand that is too language-heavy.

## Modifications

- Predictable session structure. Show the schedule.
- Do not insist on eye contact, a still body, or spoken answers if another channel works.
- If an ABA team is involved, ask their goal so you do not contradict it, and do not absorb their hours.
- Use the developmental-complexity series first. Use the behavior-modification training for the functional view, with the exclusion in mind.

## Sources

- [CDC — Autism](https://www.cdc.gov/autism/index.html) — Surveillance context and basic description. Pair it with the child's own evaluation, not instead of it.
- [American Academy of Pediatrics](https://www.aap.org/) — Pediatric guidance on autism identification and co-occurring conditions.
- [Society of Pediatric Psychology](https://pedpsych.org/) — Pediatric psychology practice with neurodevelopmental conditions.

id: chronic-pain
title: Chronic pain
summary: Pain is real. Fear-avoidance and family responses maintain disability. Path 1 includes chronic pain disorders with an evidence base for behavioral treatment.
group: Pain
order: 140
completeness: stub
statusBadge: Draft - pending medical team review
reviewer: ""
reviewDate: ""
systems: Pain
trainingIds: 
---

## Overview

Stub for medical team review. Chronic pain disorders in children include amplified musculoskeletal pain, chronic widespread pain, some headache disorders, and pain that has outlasted the injury. The scope lists chronic pain disorders under Path 1 when there is an evidence base for behavioral treatment. Confirm the diagnosis is actually that, and not a first presentation of something else. Pain medicine, rheumatology, or the child's specialist should be in the story.

No training in the current map is specifically titled for chronic pain. Do not pretend the chronic-illness series covers it unless the team adds that link.

What the medical team still needs to add: which pain diagnoses you treat, your activity guidelines, and the red flags you want re-checked.

## Key treatments

Behavioral treatments with evidence include CBT for pain and, for some programs, graded activity and parent coaching. Physical therapy restores movement. Medicines are the prescriber's, and many families arrive hoping for a medicine that ends the pain. Sleep treatment matters. You do not prescribe, and you do not promise a pain score of zero.

## Treatment burden

Clinic shopping, missed school, a parent who has left work, and a child whose day is organized around the pain level. Repeated tests that found "nothing" feel like an accusation. Siblings resent the canceled plans.

## Adherence

Plans fail when the first step is too big, when the adults still respond to every pain behavior with total rest, or when the child hears that you think the pain is fake. Explain the goal as function with pain still possible.

## Mental health and development

Anxiety, depression, and medical trauma are common. They do not mean the pain is imaginary. Younger children show pain in behavior and clinginess. School-age children exit activities they used to be good at. Adolescents lose peers and identity. Developmental difference changes how pain is reported. A child who cannot describe an internal state still has one.

## Long-term effects

The risk is a life organized around avoidance: school exit, deconditioning, caregiver disability, and a pain identity that is hard to loosen. Some pain disorders remit. Do not promise that. Do not threaten lifelong disability either.

## Red flags

- New neurologic signs, bowel or bladder change, fever, unexplained weight loss, night pain that is new, or pain that is different from the known pattern. Back to the medical team. Do not call a new pattern "the pain disorder" by reflex.
- Suicidal ideation. Chronic pain raises that risk. Ask.
- A family giving medicines you did not know about, including relatives' prescriptions.
- Complete school withdrawal with no medical team in the loop.

## Therapy implications

### Individual

Validate the pain in the first session in a sentence the child can repeat. Then shift the goal to one valued activity. Teach a short coping skill they can use while moving, not only while resting. Watch for all-or-nothing effort.

### Family

Parent responses that remove all demands on pain days, and parent responses that accuse the child of faking, both worsen the picture. Coach a middle path the medical team agrees is safe. Caregiver fear of "missing something" needs a rule for when to call the doctor, so it is not every evening.

### Parent training

One activity goal. A calm response to pain reports. No quiz about whether it is real. Praise function. Keep the child's developmental level in the instruction: concrete for younger children, collaborative for adolescents.

## Intake questions

- Who has diagnosed the pain disorder, and what workup has already been done?
- What happens at home in the hour after the child says the pain is bad?
- What has the child stopped doing that they want back?
- Any new symptom that is not the usual pattern?

## Differentials

- Chronic pain disorder versus a new medical problem. New signs go back.
- Pain versus depression versus both.
- School refusal versus pain versus bullying versus a learning problem that pain is covering.
- For a child with diabetes, sickle cell, IBD, or cancer, do not file disease pain under this card without the specialist.

## Modifications

- No physical exposure past what PT or the physician allowed.
- Do not use the word fake, or a wink that means the same thing.
- Include the caregiver who is home on pain days.
- Say clearly when you are outside a recorded training and using supervision instead.

## Sources

- [International Association for the Study of Pain](https://www.iasp-pain.org/) — Definitions and clinician education on pain, including pediatric resources.
- [American Academy of Pediatrics](https://www.aap.org/) — Pediatric context for chronic pain and function.
- [Society of Pediatric Psychology](https://pedpsych.org/) — Professional home for pediatric pain psychology.

id: cp
title: Cerebral palsy
summary: Movement and posture differences vary widely. Do not assume intellectual disability. Pain, communication access, and dignity drive the therapy.
group: Rehabilitation
order: 110
completeness: stub
statusBadge: Draft - pending medical team review
reviewer: ""
reviewDate: ""
systems: Rehabilitation
trainingIds: dev-complexity
---

## Overview

Stub for medical team review. Cerebral palsy is a group of disorders of movement and posture from a non-progressive injury to the developing brain. Severity, type, and associated conditions (pain, epilepsy, vision, hearing, communication, learning) vary more than the label suggests. Intellectual disability is not part of the definition. Many children have typical learning. Some do not. Ask. PM&R, PT, OT, and speech are usually already involved.

What the medical team still needs to add: how your clinic talks about gross motor function levels, spasticity treatments, and pain.

## Key treatments

Physical and occupational therapy, braces, wheelchairs and other equipment, speech and AAC, medicines or injections for tone, orthopedic or neurosurgical procedures for some children, and treatment of associated epilepsy or reflux. CSC does not set the equipment or the tone plan.

## Treatment burden

Appointments, stretching programs, equipment that does not fit the house or the school, and a caregiver body that is also getting injured from transfers. The child is often spoken about in the room. That is its own burden.

## Adherence

Home exercise fails when it hurts, when it takes the whole evening, or when the child has no say. Equipment is abandoned when it is uncomfortable or babyish. Ask which piece actually helps and which piece is a fight.

## Mental health and development

Pain, fatigue, sleep, and being left out of peer activities affect mood. Communication differences are misread as low understanding or as behavior. Always assess how the child communicates before you interpret a yes. Adolescence brings privacy, dating, and the insult of still being helped with private care by a parent. Include the child in that conversation.

## Long-term effects

CP itself is not progressive, and the musculoskeletal consequences can worsen over time: contractures, pain, hip problems, fatigue. Adult services are a cliff. Mental health risk follows pain and exclusion more than the motor label alone.

## Red flags

- New severe pain, a change in walking or transfers, trouble breathing, or a seizure pattern that is new. Medical team.
- Feeding or swallowing safety: coughing with meals, recurrent chest infections. Speech and the medical team, not a behavior plan about "eating fast."
- Self-injury, suicidal ideation, or a caregiver who cannot safely transfer and has no backup.
- Skin breakdown from a chair or a brace.

## Therapy implications

### Individual

Give the communication method time. Talk to the child, not only the adult. Goals might be pain coping, peer scripts, or a say in the daily care. Do not make walking the psychological goal if the child uses a wheelchair and is fine with that.

### Family

Caregiver injury and grief are in the room. So is pride. Help adults stop finishing the child's sentences if the child has a way to answer. Siblings need a place that is not only the therapy schedule.

### Parent training

Coach one care routine that offers a real choice. Praise communication attempts. Keep behavior plans physically possible. A demand the body cannot meet is not noncompliance.

## Intake questions

- How does the child communicate, and how long do adults wait?
- Where is pain, and what is the current tone or equipment plan?
- What can the child do that adults still do out of habit?
- Who is at risk of injury during care tasks?

## Differentials

- Behavior versus pain, reflux, constipation, or fatigue.
- "Not trying" versus a motor plan that takes longer than the adult allowed.
- Low mood versus social exclusion and lack of a communication system that works with peers.
- Request for high-hour ABA versus a CSC parent-training need. Many-hour ABA is outside scope.

## Modifications

- Accessible room, time for transfers, and the child's own communication system.
- Do not use motor goals PT has not set.
- Speak to the child at chronological age.
- Use the developmental-complexity training for adaptation, not as a substitute for rehab.

## Sources

- [CDC — Cerebral palsy](https://www.cdc.gov/cerebral-palsy/index.html) — Overview of CP, associated conditions, and the range of function.
- [American Academy of Pediatrics](https://www.aap.org/) — Pediatric policy context. Confirm rehab recommendations with PM&R.
- [Society of Pediatric Psychology](https://pedpsych.org/) — Pediatric psychology alongside rehabilitation teams.

## Overview

Stub for medical team review. Crohn's disease is a form of inflammatory bowel disease: chronic inflammation that can affect any part of the gut, with real tissue injury, bleeding, weight loss, and medicines that include immune therapies. Irritable bowel syndrome is a disorder of gut-brain interaction: pain and bowel-habit change without that inflammatory injury. They are treated differently. Do not let a chart say "stomach issues" and proceed. Ask which diagnosis GI has made. A child can be evaluated for both. You should not be the one who collapses them.

What the medical team still needs to add: your center's IBD medicine list in therapist language, infection precautions on immunosuppression, and how GI wants IBS pain explained.

## Key treatments

Crohn's: nutrition plans, steroids for flares, immune-modulating medicines, biologic infusions or injections, sometimes surgery. IBS: education, bowel-habit treatment, diet changes the dietitian owns, and behavioral pain treatments. Steroids and infusion schedules are IBD facts, not IBS facts. You do not adjust any of these.

## Treatment burden

IBD: infusions, labs, flare unpredictability, growth checks, and missed school. IBS: pain that is invisible, repeated testing, and a feeling of being told it is "just stress" after the workup. Both can dominate bathroom access and meals. Families of children with Crohn's may live from flare to flare. Families of children with IBS may feel dismissed. Different injuries.

## Adherence

IBD medicines slip because the child feels well between flares, because infusions take a day, or because side effects are miserable. An IBD flare from missed medicine is a GI emergency pathway, not a therapy topic to sit on. IBS plans slip when the diet is culturally impossible or when the child hears that the pain is imaginary.

## Mental health and development

Depression and anxiety are elevated in IBD, from the illness, steroids, and the life disruption. Pain, urgency, and accidents isolate school-age children. Adolescents care about body image, growth delay, and infusions. IBS pain is real pain. Stress can worsen it. Stress is not the moral cause, and saying so clumsily repeats the dismissal the family already got.

## Long-term effects

Crohn's can affect growth, puberty, bones, and, over years, surgical and cancer-surveillance needs that GI follows. Steroid courses have mood, sleep, and body effects. IBS does not injure the bowel in that way. Its long effect is disability from pain and avoidance if the child exits school and life. Do not mix these prognoses up.

## Red flags

- For known or suspected IBD: fever, blood in stool that is new or heavier, severe pain, vomiting, dizziness, or dehydration. Call GI or emergency care. Do not frame it as IBS anxiety.
- Unexplained weight loss, waking from sleep to stool, or blood are reasons to be sure IBD was actually evaluated. Ask GI. Do not reassure.
- Steroid mood crises: severe agitation or a dramatic personality change on prednisone. Tell GI.
- Suicidal ideation.
- Do not recommend a cleanse, an opioid, or stopping an immune medicine.

## Therapy implications

### Individual

For IBD, target flare fear, procedure fear, and the social problem of urgency, plus mood. For IBS, target pain-related avoidance and a return to activity, coordinated with GI so you are not overriding a real inflammatory picture. Bathroom planning at school is a concrete intervention for both.

### Family

Parents of children with Crohn's are often vigilant for a reason. Shape the vigilance into the flare plan GI wrote. Parents of children with IBS may need help stopping a total search for a missed disease once GI has closed that search, without calling the pain fake.

### Parent training

One response to pain that does not require the child to prove it and does not cancel every demand automatically. For IBD flares, follow the GI sick plan rather than a generic "push through." For IBS, graded return to school is often the behavioral piece, with a bathroom pass that is not a negotiation.

## Intake questions

- Which diagnosis is on the GI note: Crohn's, ulcerative colitis, IBS, or still being evaluated?
- What is the current medicine, including any steroid, and what is the flare plan?
- How does bathroom access work at school?
- What foods matter culturally, and what did the dietitian actually restrict?

## Differentials

- IBD flare versus IBS pain versus anxiety. The wrong one changes both the medical response and the therapy.
- Steroid mood effects versus depression, in a child on prednisone for IBD.
- Eating restriction versus fear of pain after eating versus ARFID versus a prescribed diet.
- School refusal versus urgency and accidents the child is hiding.

## Modifications

- Read the diagnosis before you teach a gut-brain explanation. That explanation helps IBS and insults a family in the middle of a Crohn's flare if it is your whole story.
- Do not design a diet.
- Ask about steroids this month before you interpret irritability.
- Use the feeding and GI training. Chronic-illness training is not the mapped set for this card unless the team adds it.

## Sources

- [Crohn's and Colitis Foundation](https://www.crohnscolitisfoundation.org/) — Education on IBD for families and clinicians, including school and mental health.
- [NIDDK — irritable bowel syndrome](https://www.niddk.nih.gov/health-information/digestive-diseases/irritable-bowel-syndrome) — Federal overview of IBS, including pain and bowel-habit change without inflammatory injury.
- [Society of Pediatric Psychology](https://pedpsych.org/) — Pediatric psychology practice for GI conditions.

## Overview

Cystic fibrosis is a genetic condition that affects the protein CFTR. Thick mucus, recurrent lung infections, pancreatic insufficiency, and high sweat salt are the classic picture. The liver, intestines, sinuses, bones, and reproductive tract can be involved. It is a different illness in different people, and a different illness than it was before CFTR modulators.

Highly effective modulator therapy, such as elexacaftor/tezacaftor/ivacaftor for eligible mutations, has changed lung disease and daily life for many people. Not everyone is eligible. Access is uneven. A modulator does not erase the illness, the clinic, or the family's history of hospital time. Do not assume a family's burden matches a textbook from 2010, and do not assume the new medicine made therapy unnecessary.

CSC does not manage airway clearance, enzymes, or modulators. The CF team does. Your work is mood, anxiety, adherence conflict, eating, procedural fear, school, and the family system around a regimen that still takes time.

## Key treatments

Daily care often still includes airway clearance (a vest, manual percussion, or other techniques the respiratory therapist taught), inhaled medicines, and pancreatic enzymes with fat-containing meals and snacks. Doses are prescribed. You do not adjust enzyme capsules at the table.

Modulators are taken on the schedule the CF team set. Nutrition, including extra calories for some people and a different plan for others after modulators, is a dietitian's plan. Airway cultures, pulmonary function, and periodic admissions or tune-ups are medical care. CF-related diabetes is its own diabetes, not type 1 and not type 2. If it is present, read the diabetes card as well and let the CF and endocrine clinicians lead.

Some clinics still keep people with CF apart from each other because of germs that are hard to treat. Ask what this clinic does before you suggest a group. Peer support may be online or carefully arranged, not a waiting room full of other children with CF.

## Treatment burden

Even with modulators, many days include treatments that compete with school, sleep, and being a child. Vest time is boring. Enzymes at lunch are visible. Hospitalizations pull siblings and jobs out of shape. Caregivers become the treatment team at home, and then get criticized when a piece is skipped.

The burden is not the same in every house. A child on a highly effective modulator with mild lung disease is not living the same day as a child who is listed for transplant or who cannot take a modulator. Ask what this week actually contains before you import a generic chronic-illness script.

Weight has historically been a vital sign in CF. Comments about eating, from clinicians and from relatives, land differently than they do for a typical teenager. After modulators, some people gain weight they did not expect and feel judged in a new direction. Do not run a generic weight-loss frame. The dietitian and the CF team own the nutrition goal.

## Adherence

The pieces that slip are predictable: enzymes away from home, vest time when a friend is over, inhaled medicines that taste bad, refills that did not arrive, and modulator doses when the routine changed. Ask which piece, who notices, and what the fight sounds like.

Time and embarrassment are reasons. So are depression and a belief that the medicine stopped mattering because the child feels better. Feeling better is not the same as a plan to stop. Stopping is a CF-team decision.

Mood and sleep changes have been reported after starting or changing modulator therapy. Treat that report as information for the CF team. Do not blame the teenager, and do not tell the family to hold a dose. You also should not dismiss a new depression as "just the medicine" without the team and without your usual safety assessment.

Complete refusal of enzymes or airway clearance, or a secret stop, needs the CF team promptly. Shame makes families hide the stop. Make it easier to say.

## Mental health and development

The CF Foundation and the European Cystic Fibrosis Society recommend routine screening for depression and anxiety in people with CF and in caregivers. Elevated symptoms are common. Screening is a standard of CF care. A positive screen is the start of a conversation, not a label you assign alone.

Procedural anxiety, needle fear, cough, and hospital memories are frequent. So is caregiver traumatic stress after years of nights in the hospital. Siblings may be angry and guilty at the same time.

School absences, fatigue, and bathroom access affect learning and friends. Infection rules can make the child feel contagious or left out. Ask who they are allowed to see, and do not invent a playdate with another child with CF.

Most men with CF are infertile because the vas deferens did not form. That fact often arrives in adolescence, sometimes badly. It is a medical counseling topic. Do not be the person who blurts it out, and do not be surprised if it is already in the room unspoken. Questions about fertility, puberty, or sexual health go to the CF team, who can tell you what this young person has already been told. Women and girls with CF may have reduced fertility and can become pregnant. That counseling is also the CF team's.

Young children need caregivers to do the treatments. School-age children can own a piece of the routine and still need an adult for the parts that matter. Adolescents want the vest off and the enzymes in a pocket. Negotiate the visible pieces. Do not confuse a wish to be ordinary with a lack of understanding.

## Long-term effects

Lung disease can still progress. Some people need oxygen, noninvasive ventilation, or transplant evaluation. Advanced disease and survival uncertainty remain part of some families' lives in the modulator era. Do not reassure with a cure story.

CF-related diabetes, liver disease, bone disease, sinus disease, and distal intestinal obstruction syndrome are medical complications you should know exist so you do not psychologize a blockage or a new diabetes. Hearing can be affected by some antibiotic courses. Check what audiology has said before you interpret "not listening."

The long relationship with the CF team is itself a clinical fact. Families may trust that team more than a new therapist. Ask the team's formulation before you offer a competing one.

## Red flags

- Coughing blood, sudden breathlessness, chest pain, or a sharp drop in how the child usually breathes. Medical care now, not a coping skill.
- Fever or a change in cough or sputum the family was told to report.
- Severe abdominal pain, vomiting, or no stool, which can be a blockage. The CF team has a plan. You do not improvise laxatives.
- New or worsening depression, panic, or a clear change in mood or sleep after a modulator start or dose change. Tell the CF team. Do not stop the medicine yourself.
- Suicidal ideation, self-harm, or an eating pattern that has stopped enzymes, feeds, or most food.
- A complete stop of airway clearance or enzymes that the CF team does not know about.
- Any request for you to change a dose.

## Therapy implications

### Individual

Screen mood and anxiety the way the CF team expects, and tell the team what you find. Separate diabetes distress's cousin here: treatment burden, not a character flaw. Work on one skipped piece of the regimen.

Procedural and needle fear can be graded with the clinic's actual steps, not a generic fear ladder that skips the port or the culture. Body image and eating need the dietitian in the plan. Do not set a calorie goal.

If the child feels better on a modulator and wants to quit the rest, explore the wish and send the medical question back to clinic. Identity work matters: they are more than the vest, and the vest may still be on the list.

Give scripts for enzymes at the lunch table and for what to tell a new friend. Privacy is a reasonable goal.

### Family

Caregiver depression and anxiety are in scope for the CF mental-health model. Ask how the adult is sleeping. Map who does the evening treatment and what happens when that person is depleted.

Align adults so enzyme reminders are not a running criticism. Include siblings. Financial and time stress are part of the formulation, not small talk.

If infection rules have isolated the child, problem-solve contact that the clinic allows rather than pushing a group the clinic would forbid.

### Parent training

Build a treatment routine that can survive a weekday: same order, a visible end, a choice that is real (which show, not whether to do it). Praise the piece that happened.

For young children, the adult does the treatment. The child's job is a small cooperation skill. For school-age children, enzymes in the backpack are a rehearsed habit, with a school adult who knows. For adolescents, move from nagging to a check-in they helped write.

Do not punish coughs, low lung function, or weight. Those are medical data. Practice the family's rule for when to call the CF nurse. Do not write a stricter one to feel safe.

## Intake questions

- What is on today's regimen, and which piece is the one that actually gets skipped?
- Did mood, sleep, or anxiety change after a modulator was started or changed?
- How does eating and weight talk go in this family, and what has the dietitian asked for?
- What infection rules does this clinic use?
- Who is depleted: the child, a caregiver, or both?

## Differentials

- Low mood or irritability after a modulator change versus depression versus sleep loss. Report the timing to the CF team.
- Cough, chest pain, or breathlessness versus a panic attack. Pulmonary symptoms win until the CF team says otherwise.
- Restricted eating versus the nutrition plan versus an eating disorder versus cultural food practices. Do not collapse these.
- "Noncompliance" with enzymes versus not having them at school, embarrassment, or diarrhea the child is ashamed to describe.
- Inattention versus hearing loss after antibiotics, fatigue, or a busy lung day. Check audiology and sleep before an ADHD story hardens.
- CF-related diabetes symptoms versus a mood problem. If CFRD is present, highs and lows belong in the differential the way they do in type 1.

## Modifications

- Do not schedule across a treatment the child will then skip. Ask when the vest usually happens.
- Do not give enzyme, modulator, or diet advice.
- One regimen behavior on the goal list. Leave the rest for the CF team.
- Include the adult who does the evening treatment.
- If mood changed with a new modulator, document the timing in your note to the team and keep your own interpretation humble.
- Avoid a group intervention that mixes people with CF unless the clinic has said that is acceptable.

## Sources

- [Cystic Fibrosis Foundation](https://www.cff.org/) — Care guidelines, family education, and the current picture of modulator therapy.
- [Cystic Fibrosis Foundation — mental health](https://www.cff.org/medical-professionals/mental-health) — Depression and anxiety screening recommendations developed with the European Cystic Fibrosis Society.
- [Cystic Fibrosis Foundation — CFTR modulator therapies](https://www.cff.org/intro-cf/cftr-modulator-therapies) — Plain-language overview of who modulators are for and what they do not replace.
- [Society of Pediatric Psychology](https://pedpsych.org/) — Professional home for pediatric psychology consultation alongside chronic illness teams.

## Overview

Stub for medical team review. Duchenne muscular dystrophy is a genetic condition, most often in boys, causing progressive muscle weakness. Heart and breathing muscles are involved over time. Learning, attention, autism, and emotional regulation problems are more common because dystrophin is also in the brain. Steroids are a disease-modifying treatment and a mood treatment problem. Newer genetic therapies exist for some mutations. The neuromuscular team decides.

Corticosteroids, cardiac medicines, respiratory care, PT and equipment, and mutation-specific therapies for some children. Steroid stress dosing on sick days is a medical plan. You do not give steroid advice. You need to know a plan exists so you do not tell a family to "just skip a dose" when the child is ill.

The care increases as walking, then transfers, then breathing change. Families are grieving in advance while also doing a hard daily routine. Steroids change appetite, sleep, and mood. Equipment and home modifications are a second job. Clinic days are long.

## Adherence

Steroids are hard because of mood and body changes, and stopping them suddenly can be dangerous. That risk is the team's to explain. Your job is the conflict and the side effects the family is afraid to report. Exercise recommendations are specific. "Try harder" is the wrong intervention.

ADHD, autism, anxiety, and learning disabilities are overrepresented. Assess them as part of Duchenne, not as a surprise. Steroid irritability can look like a behavior disorder. Disease progression brings grief that children understand earlier than adults wish. Use the developmental lens. A child can be gifted in one area and need support in another. Ahead and behind can both be true.

## Long-term effects

Loss of walking, contractures, heart disease, and respiratory failure shape the years. Timelines vary and have changed with steroids and newer care. Do not quote a life expectancy you remember from training. Heart and breathing symptoms are medical. Transition to adult neuromuscular care needs a plan.

## Red flags

- Chest pain, fainting, palpitations, or new trouble breathing. Emergency or neuromuscular team now.
- A family considering stopping steroids because of behavior. They need the neuromuscular clinician before they hold a dose. Sudden stops can be medically dangerous.
- Fractures after a fall. Steroids and weak bones make this more than a bruise.
- Suicidal ideation or a caregiver who cannot safely transfer.

### Individual

Mood on steroids, peer loss as mobility changes, and concrete coping for procedures. Learning and attention interventions should match the actual cognitive profile. Do not use walking as the measure of effort.

### Family

Anticipatory grief and caregiver injury are in scope. Parents may disagree about how much to tell the child. Help them align. Siblings, including carriers who are being tested, need their own sentence in the formulation.

### Parent training

Behavior support during steroid irritability: lower demands, protect sleep, do not start a new punishment system the week the dose changes. Keep one enjoyable activity that is physically possible this year. Ask PT what that is.

- Where is mobility now, and what changed in the last year?
- What steroid is in use, and did mood or sleep change with it?
- Any cardiac or breathing symptoms the team has not heard?
- What learning, attention, or autism diagnoses are already documented?

## Differentials

- Steroid mood effects versus ADHD versus anxiety versus grief.
- Refusal to participate versus fatigue, pain, or a task that is no longer physically possible.
- Caregiver depression versus exhaustion from nighttime care.

- No physical icebreakers that ignore the PT precautions.
- Do not give steroid advice, including "take a break."
- Plan for fatigue. Shorter sessions are legitimate.
- Use the developmental-complexity training. A chronic-illness recording that covers Duchenne is not in the current map.

## Sources

- [Parent Project Muscular Dystrophy](https://www.parentprojectmd.org/) — Family and clinician education on Duchenne, steroids, heart, and breathing care.
- [CDC — muscular dystrophy](https://www.cdc.gov/muscular-dystrophy/index.html) — Overview of muscular dystrophies including Duchenne.
- [American Academy of Pediatrics](https://www.aap.org/) — Pediatric context. Confirm neuromuscular specifics with the treating team.

## Overview

Stub for medical team review. Encopresis is repeated passage of stool in a place other than the toilet, most often from chronic constipation and overflow. The child often cannot feel the leak and is then accused of doing it on purpose. A smaller group have soiling without constipation. GI or pediatrics should say which picture this is. Path 1 of the CSC scope includes encopresis because there is an evidence base for behavioral treatment beside medical bowel care.

Laundry, smell, secrecy, and a parent who is furious and ashamed. School accidents end friendships. The regimen of medicine and sits has to happen every day, including days when everyone wants to forget the problem exists.

## Adherence

Families stop the laxative when the huge accidents pause, and the constipation returns. Punishment makes the child hide underwear. Ask what the last cleanout was and whether the maintenance dose is actually being given.

## Long-term effects

Most retentive encopresis improves when constipation is actually treated and shame is reduced. Untreated constipation can go on for years. Soiling that starts a new psychiatric identity ("the kid who does this on purpose") outlasts the constipation if adults keep that story.

- Blood in stool, weight loss, or soiling that started with urinary symptoms. Back to pediatrics or GI.
- Suspected abuse. Soiling can be a signal. It is not proof. Use your reporting judgment.
- Suicidal ideation or bullying that has become dangerous.

### Family

The adult who is angriest needs a job that is not surveillance of underwear. Align all caregivers so one is not sneaking punishment. Explain overflow until the "on purpose" story loosens.

### Parent training

- What did GI or pediatrics say: retentive constipation, or soiling without it?
- What cleanout and daily medicine were prescribed, and what is actually happening?
- What do adults do when they find soiled underwear?
- Any toilet fear, pain with stool, or a developmental difference that changes teaching?

- Soiling versus diarrhea from laxatives that are dosed too high. That is a prescriber question.

- Do not run a behavior plan in the absence of a bowel plan.
- Do not punish accidents.

- [Society of Pediatric Psychology](https://pedpsych.org/) — Pediatric psychology practice for elimination disorders.

## Differentials

- Enuresis versus a urinary tract infection, diabetes, constipation, or a neurologic bladder. Medical screening is not optional at the start.
- Night wetting versus the child not wanting to leave the bed because of fear or because an adult responds with anger.
- Daytime urgency versus anxiety versus a voiding schedule the child cannot remember at their developmental level.

## Modifications

- Do not punish wet nights. Do not wake the child hourly as your own invention. If a night-waking plan exists, it should be the prescriber's.
- Know the fluid rule if desmopressin is in use, and do not design an exposure that breaks it.
- Match the alarm coaching to family sleep capacity. A plan no one can do for a week is not evidence the child is unmotivated.
- Be honest that the enuresis recording is not in the library yet.

## Sources

- [AAP HealthyChildren — bedwetting](https://www.healthychildren.org/English/ages-stages/toddler/toilet-training/Pages/bedwetting.aspx) — Family-facing overview of bedwetting from the American Academy of Pediatrics.
- [NIDDK — bladder control problems in children](https://www.niddk.nih.gov/health-information/urologic-diseases/bladder-control-problems-bedwetting-children) — Federal overview of daytime and nighttime wetting.
- [Society of Pediatric Psychology](https://pedpsych.org/) — Pediatric psychology practice for elimination disorders.

## Overview

Stub for medical team review. Epilepsy is a tendency to unprovoked seizures. Type matters: absence, focal, generalized convulsive, and others do not look alike and do not disrupt school the same way. Neurology owns the diagnosis, the medicine, and the rescue plan. Some events that look neurologic are functional. That is a different card, and neurology should say which is which.

What the medical team still needs to add: the seizure types you want therapists to recognize, the local rescue-plan language, and the medicines most often tied to mood or irritability in your clinic.

## Key treatments

Daily antiseizure medicines, sometimes a diet, a device, or surgery. Rescue medicine for prolonged or clustered seizures, written down for school. Many children also need a sleep plan, because sleep loss lowers the threshold. You do not adjust medicines or tell a family to "give it one more minute" if their plan says otherwise.

## Treatment burden

Medicine twice a day, refills, levels, EEGs, and the background fear of the next seizure. Driving, swimming, and climbing restrictions hit adolescents hard. Caregivers may not sleep. School plans and who is allowed to give rescue medicine take real advocacy.

## Adherence

Missed doses cluster around adolescence, side effects, and a stretch without seizures that makes the medicine feel optional. A missed dose is a neurology safety issue. Ask which dose, and whether side effects are the reason.

## Mental health and development

ADHD symptoms, anxiety, depression, and learning problems are all more common, from the epilepsy, the medicine, the sleep, or a shared developmental condition. Staring spells can be absence seizures. Irritability can be a medicine effect. Some medicines, including levetiracetam for a subset of children, are associated with mood or behavior change. Do not guess which medicine. Ask neurology what they suspect, and do not stop it yourself.

## Long-term effects

Depends on syndrome, seizure control, and cause. Some epilepsies resolve. Some are part of a broader developmental condition. SUDEP is a real risk neurology discusses with families. Do not introduce it casually, and do not be shocked if a parent is carrying it.

## Red flags

- A seizure longer than the written rescue plan allows, clusters, trouble breathing, injury, or a first convulsion. Follow the plan and emergency services.
- A change in seizure pattern, a new type of spell, or medicine stopped suddenly.
- Suicidal ideation. Some antiseizure medicines carry mood warnings. Report timing to neurology and use your safety pathway.
- Events nobody has classified. Do not decide alone that they are "just behavior."

## Therapy implications

### Individual

Worry about the next seizure, shame after a public event, and missed school are legitimate targets. Keep ADHD and mood questions open while spells and medicines are being sorted. Give the child a short script for peers.

### Family

Caregiver hypervigilance is understandable and can squeeze independence. Expand one safe freedom the neurologist has already allowed. Align adults on the rescue plan so the child hears one version.

### Parent training

Rehearse the rescue plan until the adult can say it calmly. Praise ordinary rules that are not about seizures, so the whole relationship is not surveillance. Do not punish a post-ictal period of confusion or sleep.

## Intake questions

- What type of seizures, when was the last one, and what does the rescue plan say word for word?
- Any staring spells that school is calling inattention?
- Which medicine changed recently, and did mood, appetite, or sleep change with it?
- What activities are restricted, and which of those is the child breaking?

## Differentials

- ADHD versus absence seizures versus medication side effects versus sleep loss. This is the differential the additional-topics training is for. Do not close it in one interview.
- Irritability versus a named medicine effect versus pain versus a mood disorder.
- Functional events versus epileptic events. Neurology makes that call. A child can have both.

## Modifications

- Know the rescue plan before you do exposure work that could be mistaken for a spell, including breath-holding or intense crying practice.
- Do not suggest stopping a medicine because behavior improved or worsened.
- If spells are unclassified, pause the behavior plan and ask neurology.
- Link the ADHD-differential training when the URL is added.

## Sources

- [Epilepsy Foundation](https://www.epilepsy.com/) — Family education on seizure types, safety, and rescue planning.
- [American Epilepsy Society](https://www.aesnet.org/) — Professional society for epilepsy clinicians.
- [Society of Pediatric Psychology](https://pedpsych.org/) — Pediatric psychology consultation when seizures and behavior overlap.

## Overview

Stub for medical team review. Functional neurological symptom disorder involves neurological symptoms — weakness, movements, sensory change, events that look like seizures — that are real and are not explained by a structural lesion of the kind the symptom suggests. Best practice is a positive diagnosis by neurology, not a diagnosis of exclusion announced as "nothing is wrong," and not an accusation of faking.

No recorded CSC training is mapped to this card yet. Add a training id in the frontmatter when one exists.

What the medical team still needs to add: the language your neurologists use with families, which symptoms they want co-managed, and the local pathway with PT and psychiatry.

## Key treatments

A clear explanation from the diagnosing clinician, physiotherapy for motor symptoms, and psychological treatment such as CBT adapted for FND. Medicines may treat coexisting pain, anxiety, or depression. They do not "fix" FND by themselves. You should not be the first person to say the symptom is functional if neurology has not said it.

## Treatment burden

Families have often been through many tests and at least one clinician who implied the child was pretending. School has sometimes treated the symptom as truancy. The household organizes around the symptom. That is exhausting even when everyone believes the child.

## Adherence

Children and parents drop out when they hear "it's psychological" as a dismissal. Attendance improves when the explanation preserves the reality of the symptom and offers a mechanism they can respect. Ask what they were told, in their words, before you add yours.

## Mental health and development

Anxiety, depression, trauma, and perfectionism are common and are not required for the diagnosis. A child can have FND and epilepsy, or FND and a developmental difference. Younger children need a concrete explanation. Adolescents need dignity and a way back to school that is not "just go."

## Long-term effects

Many improve, especially with an early, respectful explanation and rehab. Some symptoms persist. Chronic disability, school exit, and family conflict are the risks of a slow or blaming pathway. Do not promise a timeline.

## Red flags

- New symptoms neurology has not seen: a new severe headache, true loss of consciousness with injury, fever, rapidly worsening weakness. Functional history does not cancel emergency care.
- Suicidal ideation or self-harm.
- A school or family plan that requires the child to prove the symptom is real by suffering.

## Therapy implications

### Individual

Use the neurologist's explanation. Add a practical goal: one step back toward walking, talking, or attending school. Attention to the symptom from adults often maintains it. Shift attention toward the function the child is recovering, without withdrawing warmth.

### Family

Parents are not the cause by default. They may be reinforcing the symptom by accident because they are scared. Teach a response that stays kind and stops organizing the whole day around the symptom. Screen for caregiver distress.

### Parent training

One calm response when the symptom appears. Avoid quizzes ("can you really not move?"). Avoid rewards that require the symptom. Praise the fragment of ordinary function. Loop PT in so the home practice matches theirs.

## Intake questions

- Who made the diagnosis, and what words did they use with the family?
- What happens in the ten seconds after the symptom starts, at home and at school?
- Is epilepsy also on the list, and is there a rescue plan you must not ignore?
- What has school been told to do?

## Differentials

- Functional events versus epileptic seizures. A child can have both. Rescue plans still apply to the epileptic ones.
- FND versus a neurological diagnosis that was missed. New or changing signs go back to neurology.
- Symptom attention versus malingering. Do not reach for faking. It is rarely the right word and it ends the treatment.

## Modifications

- Do not start by hunting a hidden trauma as the price of admission. Trauma may be present. It is not the only door.
- Coordinate with PT. Contradictory plans are common and harmful.
- Keep school goals small and agreed with the medical team.
- There is no mapped training yet. Say so, and use supervision.

## Sources

- [FND Society](https://www.fndsociety.org/) — Professional society with clinician education on diagnosis and care.
- [FND Hope](https://fndhope.org/) — Patient-organization education that many families have already found. Know what it says.
- [American Academy of Pediatrics](https://www.aap.org/) — General pediatric context. Confirm neurology guidance locally before you teach from it.

## Overview

Stub for medical team review. Hemophilia is an inherited bleeding disorder, most often factor VIII or IX deficiency. Severity varies. People of all sexes can be affected or be symptomatic carriers. Modern prophylaxis, including factor replacement and newer non-factor medicines, has changed joint disease for many children. The bleeding-disorders team owns the product, the dose, and activity limits.

What the medical team still needs to add: which products your clinic uses, your head-injury rule, inhibitor basics for therapists, and how you want activity restrictions explained.

## Key treatments

Regular prophylaxis to prevent bleeds, on-demand treatment for bleeds, and a written plan for procedures, dental work, and sports. Home infusion is a family skill. Physical therapy protects joints. Inhibitors, in a subset of children, make treatment much harder. Do not describe products you have not confirmed with the team.

## Treatment burden

Infusions, or the emotional load of a port, organize the week. Parents watch every limp. Activity decisions create conflict with coaches and relatives. The child may look fine and still be one injury away from a long bleed. Clinic visits and insurance for expensive medicines are their own job.

## Adherence

Prophylaxis slips when a child feels well, when a teen does not want to infuse, or when supplies fail. A missed dose is a bleeding-disorders conversation, not a character conversation. Ask what gets in the way of the specific dose.

## Mental health and development

Procedural fear, parent hypervigilance, and the child's wish to play the sport everyone else plays are the common themes. Young children cannot judge risk. School-age children can learn a simple report-the-limp rule. Adolescents hide bleeds and skip doses to be ordinary. Pain from a target joint affects mood and participation.

## Long-term effects

Joint disease, chronic pain, and, for some older regimens, historical infection risk that families may still mention. Inhibitors change the story. Transition to adult care is a known cliff. The team should say which of these apply to the child in front of you.

## Red flags

- Head, neck, belly, or eye injury, a severe headache after a hit, or a bleed that is not stopping. Follow the family's emergency plan. Do not watch a head injury to see if behavior improves.
- A joint that is swollen, warm, or refused. That can be a bleed, not defiance.
- Do not recommend ibuprofen, aspirin, or other medicines. The bleeding-disorders team has a list.
- Suicidal ideation, or a complete stop of prophylaxis the team does not know about.

## Therapy implications

### Individual

Fear of needles and fear of injury can be graded beside the real infusion steps. Help the child script how to tell a coach or a friend. Do not promise a sport the team has restricted.

### Family

Overprotection is often a successful safety strategy that has grown too wide. Shrink one limit at a time with the team's activity list in hand. Caregivers need a place to put the vigilance that is not the child's body.

### Parent training

Teach a calm injury script: stop, assess, call the number on the card. Praise reporting a bleed more than toughness. Match independence to age: a school-age child can carry the letter; a teen can own one piece of prophylaxis if the team agrees.

## Intake questions

- What product is in use, who infuses, and what is the head-injury rule?
- Which activities are allowed, limited, or off the list?
- Any target joint, inhibitor, or recent bleed that changed mood or school?
- Where do caregiver fear and the child's wish for independence collide?

## Differentials

- Refusal to walk or to participate versus a joint or muscle bleed.
- Anxiety versus appropriate caution after a real head-injury rule. Do not desensitize a family to the warning signs they were taught.
- Oppositional behavior in a teen versus skipped prophylaxis and fear of being seen infusing.

## Modifications

- Know the activity restriction before you assign an exposure, a sport metaphor, or a physical icebreaker.
- Do not comment on medicines.
- Include the adult who infuses.
- If the child is a girl or a symptomatic carrier, do not act surprised. Confirm the diagnosis with the team rather than guessing from an old stereotype.

## Sources

- [National Bleeding Disorders Foundation — hemophilia A](https://www.bleeding.org/bleeding-disorders-a-z/types/hemophilia-a) — Education from the foundation formerly known as the National Hemophilia Foundation.
- [CDC — Hemophilia](https://www.cdc.gov/hemophilia/index.html) — Overview of diagnosis, treatment, and complications.
- [Society of Pediatric Psychology](https://pedpsych.org/) — Pediatric psychology practice alongside hematology.

## Overview

Childhood cancer is a group of diseases, not one illness with one script. This card covers the two the team asked for in draft: leukemia, especially acute lymphoblastic leukemia, the most common childhood cancer, and brain tumors. Other diagnoses need oncology to tell you what is different. Do not stretch this card to cover a diagnosis you have not asked about.

Active treatment, maintenance, the months after treatment, and long-term survivorship are different psychological jobs. Relapse is another. Prognosis varies enormously. Do not reassure a family with a cure rate you heard somewhere, and do not tell a brain-tumor family that "children's cancer usually turns out fine." Use the words oncology is already using.

Psychosocial care is a standard of pediatric oncology, not a luxury if there is time. The Standards of Care for children with cancer and their families describe screening, access to psychology and psychiatry, school support, and palliative care as expected. CSC works beside the oncology psychosocial clinicians. Ask who is already involved so the child does not get two competing plans.

You do not manage chemotherapy, radiation, fever rules, or transfusions. You do need to know enough to stop psychologizing a medical emergency, a steroid pulse, or a late effect.

## Key treatments

### Leukemia

Treatment is a long protocol: induction, consolidation, and maintenance that can run for years, built by the oncology group. A central line or port is common. Intrathecal chemotherapy puts medicine into the spinal fluid to protect the brain. Cranial radiation is much less common in modern leukemia therapy than in older eras. Do not assume this child had it. Ask.

Corticosteroids, often dexamethasone or prednisone, are given in pulses. Those weeks are a known behavioral risk. Vincristine can cause neuropathy and constipation. Asparaginase and other agents have their own medical toxicities. You do not need to recite the protocol. You need the calendar: what is this child receiving this month, and what did the team say it does to mood, sleep, walking, and school.

### Brain tumors

Treatment may include surgery, chemotherapy, radiation, or a combination, depending on the tumor. Deficits follow location. Posterior fossa surgery can be followed by cerebellar mutism, also called posterior fossa syndrome: reduced speech, emotional lability, and motor changes. Families are sometimes told it will simply resolve. Recovery is variable. Do not treat the speech change as selective mutism or as oppositionality.

Cranial radiation and some chemotherapies carry cognitive, endocrine, and hearing late effects. Younger age at cranial radiation is associated with greater cognitive risk. You do not need the dose in your head to take that seriously. Neuropsychology and oncology interpret the dose. You adapt the therapy hour and the school plan to the result.

### Steroids, chemotherapy, and radiation

Steroid pulses can bring irritability, mood swings, sleep loss, a fierce appetite, tearfulness, and aggression. Less often, severe agitation or psychotic symptoms appear. These are medicine effects. Time-limited does not mean trivial. Plan for the pulse weeks. Tell the school. Tell the family it is the medicine. A new severe psychiatric picture goes to oncology the same day, not to a new diagnosis you make alone.

Chemotherapy late effects that change therapy include fatigue, hearing loss (especially after platinum agents — ask audiology), neuropathy, heart-muscle effects after anthracyclines (activity limits are medical), and cognitive effects after intrathecal methotrexate. Radiation late effects include cognitive change, endocrine problems (growth, puberty, thyroid), and second-cancer risk, all followed by the survivorship team.

School is a treatment setting. Hospital-homebound instruction, a 504 plan or an IEP, infection limits during active therapy, and a neuropsychology evaluation after brain tumor treatment or cranial radiation are ordinary tools. Processing speed that looks like "not trying" is a classic miss.

## Treatment burden

Active treatment reorganizes the household: appointments, admissions, a parent sleeping at the bedside, siblings farmed out, jobs at risk, infection rules that shrink the world. Maintenance looks quieter and is still years of pills, pulses, and fear of fever. Survivorship looks "done" to relatives and is not done to the family, who now watch for late effects and for relapse.

Procedures, port access, and lumbar punctures are repeated. A child who "should be used to it" is often a child who has learned to freeze or to fight. Caregivers carry traumatic stress of their own. Financial toxicity is part of the history. Ask, without turning the session into a benefits interview you cannot finish.

Guilt shows up as overprotection, as extra gifts, and as an inability to set an ordinary limit. The child may also feel guilty, especially younger children, who invent a cause.

## Adherence

During active therapy the medical team drives adherence, and the stakes of a missed medicine are theirs to explain. Your role is barriers: taste, nausea, a fight at pill time, a teenager who is done being a patient, a caregiver who cannot afford to miss another shift and misses a dose.

Pill swallowing is a skill that can be taught. Steroid weeks are a bad time to introduce a new behavioral demand. Maintenance fatigue is real: the child looks well, the end is not here, and the family loosens. Do not moralize that. Look at the calendar with them.

After treatment, follow-up visits and late-effect screening become the adherence task. Avoidance is often fear of hearing bad news. Name the fear and problem-solve the appointment. Do not call it denial as an insult.

## Mental health and development

Worry, procedural fear, low mood, traumatic stress, and family strain are common and do not all need a psychiatric diagnosis. Some do. Screen. Caregiver traumatic stress and sibling distress are part of the child's treatment, because the house is the recovery environment.

Young children may show the illness in play, sleep, clinginess, and regression. They need the truth in short, concrete words. Secrets breed scarier inventions. School-age children track fairness, missed work, friends who moved on, and whether they look different. Hair loss, a feeding tube, or steroids' effect on the face are social injuries. Adolescents are trying to be ordinary while the body and the calendar refuse. Privacy, dating, fertility questions, and driving sit beside scan anxiety.

Fertility counseling is the medical team's. Adolescents may be holding it unspoken. You can ask whether anyone has talked with them about the future of their body, and then route the facts back to oncology rather than improvising.

Steroid weeks in a young child look like a behavior disorder. In a teenager they look like a mood disorder or like attitude. Check the pulse calendar before you change the diagnosis.

Brain tumor survivors may have attention, processing-speed, working-memory, and executive-function difficulties, plus fatigue, hearing or vision changes, and endocrine late effects. Social skills can lag because of missed years, cognitive change, or both. Adapt the session. Refer for neuropsychology rather than repeating a talk therapy that assumes typical processing.

## Long-term effects

The Children's Oncology Group long-term follow-up guidelines are the map survivorship clinics use. Late effects depend on the tumor, the age, the drugs, the radiation field, and the doses. You will not memorize that grid. You will ask whether a survivorship or neuropsychology visit has happened, and you will read the recommendations that change school and daily demands.

Cognitive late effects can appear or become more obvious years later, as school demands rise. A child who looked fine in second grade may struggle in fifth. That is not a surprise to oncology. It is often a surprise to the school.

Heart, hearing, endocrine, growth, and second-cancer surveillance stay with the medical team. Activity restrictions after anthracyclines are not yours to loosen because the child is sad about sitting out. Grief for a lost version of the future, including after cure, is legitimate. So is fear before scans. People call that scanxiety. It is not irrational. It still may be treatable if it has taken over the month before every scan.

Palliative care can be involved early, alongside curative treatment. Their involvement does not mean everyone has given up. If you do not know why they are on the team, ask. Do not avoid the family because the word is frightening.

## Red flags

- Fever, especially if the family has been told the child may be neutropenic or immune-suppressed. Follow their thermometer rule. This is an emergency, not a morning appointment.
- New headache with vomiting, a seizure, new weakness, vision change, confusion, or a change in alertness. Emergency care.
- Bleeding, severe pain, trouble breathing, or a line that looks infected. Medical team now.
- Steroid pulse with severe agitation, mania, or psychotic symptoms. Oncology the same day.
- Suicidal ideation, self-harm, or a caregiver so depleted that medicines are not being given and the team does not know.
- A sudden cognitive or speech change from the child's baseline, including after brain surgery. Do not reframe posterior fossa syndrome as behavior.
- Disclosure of abuse or neglect, using your reporting duty. Illness in the family does not pause that duty.
- Any request to interpret a lab, a count, or a scan. Send it back to oncology.

## Therapy implications

### Individual

Teach procedural coping against the actual procedure: one voice, a choice that is real, a stop signal the nurse will honor if the procedure allows it. Confirm with the team which choices are real. A fake choice is worse than none.

Separate ordinary worry, scan-related fear, and traumatic memories of restraint or the ICU. Do not start trauma processing on an exhausted child in the middle of induction. Stabilize, predict, and give the caregiver a job.

Use the family's words for the illness. Do not install a battle metaphor they did not choose. Body image, hair, and the face changes of steroids deserve plain language and a plan for school re-entry, not a pep talk.

For brain tumor late effects, shorten the hour if fatigue demands it, slow your language, and put the plan in a picture or a short list. Advocate for school supports as a concrete task. Identity work can include the illness and must not require the child to be inspiring.

### Family

Ask what the child has been told, and help the adults align. Caregivers often disagree about how much to say. Caregiver traumatic stress, couple strain, and sibling resentment are in the work. Decision fatigue is real. Do not add a complicated home program during induction week.

Help the family keep one ordinary limit alive, so guilt does not erase every rule. Help them keep one ordinary pleasure alive too. Both are treatment.

If relatives are flooding the child with optimism or with stories of someone who died, problem-solve the doorway. The family is allowed to decide who visits.

### Parent training

During steroid pulses: lower demands, protect sleep, warn the school, and avoid new skill battles. The pulse will end. A behavior chart that punishes steroid irritability will fail and will shame the child.

Pill swallowing can be practiced in steps, with the team's pharmacy or nursing input if the medicine cannot be cut or mixed. Reinforce activity that matches real fatigue: pacing, not pushing through and not total withdrawal. Ask oncology or PT what the body is allowed to do.

For procedures, rehearse one caregiver script so the child does not hear three frightened adults. Comfort item, one small choice, one job for the child. Consistent limits on hitting during a pulse can be taught without a lecture about respect. The parent is allowed to be frightened and still hold a simple boundary.

After treatment, coach the return of age-appropriate expectations. Some families stay in hospital mode for years. Name that gently, and move one expectation at a time.

## Intake questions

- What is the diagnosis, where are they in treatment, and what medicines are on this month's calendar, especially steroids?
- What does the child know, and what words does the family use?
- Any new neurologic symptom, fever rule, or activity restriction you must not work around?
- What has school been told, and has neuropsychology been done or recommended?
- Who is depleted at home, and who is already providing psychosocial care on the oncology team?

## Differentials

- Irritability, aggression, or sleep collapse during a steroid pulse versus a new mood or behavior disorder. Check the calendar. Severe symptoms still go to oncology the same day.
- Inattention, slow work, or "not trying" at school versus processing-speed and working-memory late effects, fatigue, hearing loss, absence from instruction, or seizures. This differential is especially important after a brain tumor, cranial radiation, or intrathecal chemotherapy.
- Reduced speech and emotional lability after posterior fossa surgery versus selective mutism, depression, or oppositionality.
- Procedural fear versus a current medical emergency that looks similar: vomiting, headache, trouble breathing.
- Grief, ordinary sadness, and depression can all be present. Do not force cheerfulness, and do not miss suicidal ideation because "of course they are sad."
- Caregiver anxiety versus a fever rule the family was correctly taught to treat as an emergency. Do not desensitize a parent to a warning sign.

## Modifications

- Ask the calendar before you set homework. Steroid week and the days after a lumbar puncture are bad times for a new demand.
- Keep sessions shorter during active treatment if fatigue or infection risk says so. Offer caregiver-only time when the child is inpatient or asleep.
- Do not interpret labs or scans. Do not loosen an activity restriction.
- Use concrete, short plans for children with cognitive late effects. Repeat across visits. Write it down.
- Coordinate with the oncology social worker or psychologist so goals do not collide.
- For adolescents, offer time without the caregiver. Fertility, peers, and privacy may not come up with a parent in the chair.

## Sources

- [Children's Oncology Group — survivorship and long-term follow-up](https://childrensoncologygroup.org/survivorship/) — Where the long-term follow-up guidelines for late effects of chemotherapy and radiation are published. Confirm you are looking at the current version.
- [Children's Oncology Group](https://www.childrensoncologygroup.org/) — Research cooperative that runs the protocols most North American centers follow.
- [Psychosocial Standards of Care for Childhood Cancer](https://www.mattiemiracle.com/standards) — Public home of the Mattie Miracle standards (Wiener and colleagues), covering screening, psychology access, school, and family support.
- [American Academy of Pediatrics](https://www.aap.org/) — Broad pediatric policy and family-facing guidance through HealthyChildren.org. Use it for school and development context, not as a chemotherapy reference.
- [Society of Pediatric Psychology](https://pedpsych.org/) — Professional home for pediatric psychology practice in oncology and other specialties.
