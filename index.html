## Overview

Stub for medical team review. Spinal cord injury in a child or adolescent may be traumatic or related to a medical cause. The level and completeness of the injury decide movement, sensation, bowel and bladder, breathing, and blood-pressure control. PM&R owns that map. Do not generalize from one child to the next.

What the medical team still needs to add: a one-page autonomic dysreflexia script your clinic wants families to use, bowel and bladder basics you are allowed to know, and skin-check expectations.

## Key treatments

Rehabilitation therapies, equipment, bowel and bladder programs, spasticity treatment, and respiratory care when the level requires it. Psychological care for adjustment, trauma, pain, and family role change. You do not redesign the bladder program.

## Treatment burden

Care hours fall on families. Privacy disappears at an age when privacy matters most. School access, transportation, and a parent who can no longer work are daily facts. The child is often praised for inspiration and not asked what hurts.

## Adherence

Pressure reliefs, bowel programs, and skin checks fail when they are boring, when they require help the teen does not want, or when depression has flattened the day. A skipped pressure relief is a wound risk. Treat it as health behavior, not as attitude only.

## Mental health and development

Traumatic stress from the injury event, grief for the body that changed, depression, and pain are common. Children injured young may not remember a before. Adolescents do, and peers and dating become the sharp edge. Caregivers are exhausted and sometimes injured themselves. Developmental stage still applies: a 7-year-old and a 16-year-old do not need the same talk about the injury.

## Long-term effects

Depends on level. Breathing, autonomic function, fertility, pain, and overuse of the arms can all matter later. Transition to adult rehab is a known gap. Do not invent a prognosis. Ask PM&R what they have already told the family.

## Red flags

- Autonomic dysreflexia, especially with injuries at thoracic level T6 and above: sudden headache, flushing, sweating, goosebumps, a slow heart rate, anxiety, or a feeling that something is very wrong. This is an emergency. Sit the person up if that is the plan they were taught, loosen tight clothing, and get emergency care. Emptying the bladder or bowel is the team's algorithm, not something to improvise if you have not been trained. Do not treat this as a panic attack.
- Fever, a new pressure injury, trouble breathing, or a change in strength. Medical team.
- Suicidal ideation. Ask, including about equipment and access.
- A caregiver who cannot safely do transfers.

## Therapy implications

### Individual

Adjustment, trauma memories of the injury, peer scripts, and a concrete problem such as asking for help without losing the afternoon. Privacy and body image are legitimate entire goals. Do not rush meaning-making.

### Family

Role changes, caregiver health, and siblings. Parents may hover in ways that block the skills rehab is teaching. Align with the rehab goals rather than building a second plan.

### Parent training

Coach the care task that is becoming a fight, with the rehab team's steps. Keep one expectation that is not medical so the relationship is not only care. For younger children, the adult runs the safety routines. For teens, negotiate one piece of self-care they will own.

## Intake questions

- What level of injury has PM&R documented, and does the family have an autonomic dysreflexia plan?
- What do bowel, bladder, skin checks, and transfers look like, and where is the conflict?
- What changed in mood, sleep, pain, and school?
- Who else was affected by the event?

## Differentials

- Panic or irritability versus autonomic dysreflexia. Headache plus flushing is not a coping failure.
- Depression versus pain, poor sleep, or a bladder infection.
- Refusal of a care task versus pain, spasticity, or a task that has not been adapted to the child's hands.

## Modifications

- Accessible space, time, and no surprise physical demands.
- Know the dysreflexia plan before you do any exposure that could be mistaken for it, and before you coach "sit with the sensation" for a headache.
- Do not give bowel, bladder, or skin advice beyond what rehab taught.
- Use the developmental lens for age. The injury is not the whole developmental profile.

## Sources

- [Christopher and Dana Reeve Foundation](https://www.christopherreeve.org/) — Family education on spinal cord injury, including autonomic dysreflexia.
- [Model Systems Knowledge Translation Center — SCI](https://msktc.org/sci) — Plain-language factsheets from the spinal cord injury model systems.
- [Society of Pediatric Psychology](https://pedpsych.org/) — Pediatric psychology practice in rehabilitation.

## Overview

Stub for medical team review. Sickle cell disease is a group of inherited red-cell disorders. Pain episodes, anemia, infection risk, and effects on the brain, lungs, and organs vary by genotype and by the child. In the United States it predominantly affects Black children, and many families have already been doubted when they reported pain. That history belongs in the formulation.

What the medical team still needs to add: the genotypes you see most, the home pain plan versus the emergency plan, hydroxyurea counseling points, and which school findings should trigger a hematology call about silent stroke.

## Key treatments

Common pieces include hydroxyurea or other disease-modifying medicines, penicillin prophylaxis in younger children, transcranial Doppler screening, pain plans, transfusions for some children, and, for a subset, stem-cell transplant or newer gene therapies. Doses and eligibility are hematology's. Fever is an emergency in many of these children because of infection risk. Use the family's written rule.

## Treatment burden

Pain can arrive without warning and cancel school, sleep, and plans. Clinic, labs, and imaging are frequent. Caregivers become experts and are still sometimes treated as drug-seeking when they advocate. Siblings and jobs take the strain. A child who looks well between crises is not a child without an illness.

## Adherence

Hydroxyurea and other daily medicines fail for ordinary reasons: taste, refills, doubt that a preventive medicine matters on a good week, and mistrust after being dismissed. Ask what happened the last time they sought care for pain. Do not open with a compliance lecture.

## Mental health and development

Depression, anxiety, and medical traumatic stress are common and under-asked. School problems may reflect silent cerebral infarcts, fatigue, missed days, or pain, not motivation. Learning and attention questions belong with neuropsychology and hematology, not only with a behavior plan. Adolescents face pain, opioids stigma, and transition.

## Long-term effects

Chronic organ effects, avascular necrosis, lung disease, and stroke risk continue into adulthood. Transition planning starts before the last pediatric visit. Cognitive effects of silent stroke can show up as the curriculum gets harder.

## Red flags

- Fever, trouble breathing, chest pain, severe headache, sudden weakness, trouble speaking, a prolonged erection, or pain that is not responding to the home plan. These are emergency patterns in sickle cell disease. Follow the family's hematology instructions.
- Suicidal ideation, or pain so uncontrolled the child cannot drink, walk, or sleep.
- Any request for you to change an opioid or hydroxyurea dose.

## Therapy implications

### Individual

Believe the pain report. Separate pain crises, fear of the next crisis, and low mood. Give the child language for school that does not require them to perform suffering. Do not use distraction as a way of implying the pain is optional.

### Family

Ask about prior experiences of biased care. Map the home pain plan so adults are consistent. Include siblings. Support the caregiver who is always the one to decide whether this night is the emergency department.

### Parent training

Coach a calm, rehearsed emergency script. Praise early use of the home plan rather than toughness. Keep one non-medical routine alive on good days. Do not punish school absence caused by a crisis.

## Intake questions

- What is the written plan for fever and for pain, and when do they go to the emergency department?
- Any history of stroke, abnormal transcranial Doppler, or a school concern about learning or attention?
- What happens when they say the pain is severe — at home, at school, and in the hospital?
- Which daily medicine is hard to take, and why?

## Differentials

- School refusal or "behavior" versus pain, fatigue, or cognitive change from silent stroke.
- Depression versus anemia, poor sleep from pain, or a recent crisis.
- Opioid concern versus undertreated pain. Hematology owns that line. Do not import an adult addiction script.

## Modifications

- Do not schedule a heavy exposure task on the back of a crisis week.
- Do not question the reality of a pain rating.
- Ask whether neuropsychology or a school plan is already in motion before you set cognitive goals.
- Link the family to the chronic-illness training once the recording URL is added.

## Sources

- [CDC — Sickle cell disease](https://www.cdc.gov/sickle-cell/index.html) — Overview, complications, and data on who is affected.
- [American Society of Hematology](https://www.hematology.org/education/patients/anemia/sickle-cell-disease) — Patient and clinician education on sickle cell disease.
- [Society of Pediatric Psychology](https://pedpsych.org/) — Pediatric psychology consultation alongside hematology.

## Overview

Stub for medical team review. Traumatic brain injury ranges from a concussion that resolves to a severe injury with lasting cognitive and behavioral change. The mechanism, the severity, and how long ago it was all change the therapy. PM&R, neurology, and neuropsychology should be the source of what this brain can do right now. Families often need someone to say that irritability, fatigue, and a shorter fuse can be the injury.

What the medical team still needs to add: your return-to-school and return-to-play rules, and the late symptoms you want re-imaged or re-seen.

## Key treatments

Rest and a graded return after concussion, as the treating clinician wrote it. Rehabilitation therapies after more severe injury. Medicines for sleep, headache, tone, or mood only if a prescriber started them. Educational supports. You do not clear a child for sports or for a full school day.

## Treatment burden

A child who "looks fine" and is not fine. Repeated explanations to school. A caregiver who was also in the accident, or who feels guilty. Siblings living with a personality that changed. Appointments stacked on fatigue.

## Adherence

Return-to-activity plans fail when the child feels better for an hour and overdoes it, or when a coach overrules the restriction. Sleep recommendations fail when screens are the only thing that feels easy. Ask what the written restriction actually says.

## Mental health and development

Personality change, emotional lability, slowed processing, headaches, and sleep disruption are core, not side issues. Pre-injury ADHD, anxiety, or learning problems are still there and are now harder to see. Younger children may not have the words. Adolescents may be furious about restrictions and about friends who moved on. Substance use and driving become safety issues in teens.

## Long-term effects

Many concussions resolve. Repeated concussions and moderate to severe injuries carry lasting cognitive, behavioral, and headache risk. Neuropsychology over time is often more useful than a single early test. Adult outcomes depend on the injury and on how school and family responded. Do not predict from a story you heard.

## Red flags

- Worsening headache, repeated vomiting, seizure, weakness, unequal pupils, confusion that is worse than this child's baseline, or a child who is harder to wake. Emergency care.
- A new neurologic symptom months out that the team has not heard.
- Suicidal ideation. Ask. Impulsivity after injury can make this less predictable.
- Return to contact sports against medical advice. Tell the team. Do not negotiate the clearance yourself.

## Therapy implications

### Individual

Slow the session. One goal. Write it down. Fatigue is a stop signal, not resistance. Irritability gets a plan that assumes a shorter fuse, not a moral lesson. Rehearse the school script.

### Family

Teach the family that the behavior may be the injury, without taking away every expectation. Caregiver guilt and couple conflict are common. Protect siblings from becoming extra parents.

### Parent training

Shorter demands, a quiet recovery break that is not a punishment, and consistent limits on the one behavior that is dangerous. Do not ground a child for a post-injury meltdown in the same way you would have before. Do not drop all limits either. One or two rules, kept.

## Intake questions

- What was the injury, how long ago, and what restrictions are still in writing?
- What is different from before: sleep, temper, school, friends, headaches?
- Has neuropsychology been done?
- Who else was hurt, and who feels responsible?

## Differentials

- Irritability or inattention from the injury versus ADHD versus poor sleep versus depression versus a medicine effect.
- Headache flare versus a new injury or a neurologic complication. New or worse neurologic signs are not a coping failure.
- Avoidance of school versus cognitive fatigue the schedule has not caught up with.

## Modifications

- Short sessions. Written plans. Low sensory load.
- Do not do intense emotional exposure on a day the headache plan says to stop.
- Check the sports and school clearance before you assign activity.
- Use the developmental-complexity training to adapt pace. The injury may drop skills below chronological age. Keep the topics age-respectful.

## Sources

- [CDC — Traumatic brain injury](https://www.cdc.gov/traumatic-brain-injury/index.html) — Overview of TBI and concussion, including symptoms to take seriously.
- [Brain Injury Association of America](https://www.biausa.org/) — Education and family resources on brain injury.
- [Society of Pediatric Psychology](https://pedpsych.org/) — Pediatric psychology practice during rehabilitation.

## Overview

Stub for medical team review. Tic disorders include provisional tic disorder, persistent motor or vocal tic disorder, and Tourette syndrome. Tics are sudden, recurrent, non-rhythmic movements or sounds. They wax and wane. They are suggestible and they worsen with stress, illness, and sometimes with being watched. They are not a choice and not a defiance. The scope lists tic disorders under Path 1 because there is an evidence-based behavioral treatment.

The additional-topics training includes tics. Use it.

What the medical team still needs to add: when your clinic starts medicine, and how you want therapists to talk about sudden tic-like events that may not be typical tics.

## Key treatments

Comprehensive Behavioral Intervention for Tics (CBIT), including habit reversal, is the first-line behavioral treatment for many children when tics cause impairment. Psychoeducation alone helps some families. Medicines are a neurology or psychiatry decision when tics are impairing and behavioral treatment is not enough or not available. You do not start those medicines. Co-occurring ADHD, OCD, and anxiety are treated on their own merits. Treating the comorbidity often matters as much as treating the tic.

## Treatment burden

A child who is stared at, corrected, or sent out of class. A parent who cannot stop saying "stop." Hours of internet videos that made the tics worse. Siblings who imitate, sometimes cruelly, sometimes because tics are contagious in a room for a little while.

## Adherence

CBIT practice fails when it is long, when it is done as punishment, or when the competing response is embarrassing. Awareness training fails if the child is too young or too ashamed. Ask for two minutes of practice, not a personality change.

## Mental health and development

ADHD, OCD, anxiety, and learning problems commonly travel with Tourette syndrome. Rage attacks in some children are a known associated problem and are not ordinary oppositionality. Bullying and shame drive withdrawal. Younger children need caregiver-delivered CBIT components. School-age children can learn a competing response. Adolescents care about whether anyone can tell.

## Long-term effects

Many children's tics improve by late adolescence. Some do not. The comorbidities often outlast the worst tic years. Do not promise they will grow out of it on a date. Do not warn them that it is forever.

## Red flags

- Sudden severe neurological symptoms that are not this child's usual tics: prolonged unresponsiveness, new weakness, a seizure-like event. Neurology or emergency care. Not every flare is "just tics."
- Self-injury from a tic, such as hitting the face hard. Tell neurology. Protect the body.
- Suicidal ideation or bullying that has become unsafe.
- A family request to punish tics until they stop. That is not treatment. Explain why, and do not build the chart.

## Therapy implications

### Individual

Psychoeducation that removes blame. If you are trained in CBIT, use it for tics that bother the child, not for every tic an adult dislikes. If you are not trained, say so and use the recorded training plus supervision rather than inventing a suppression program. Treat the OCD, anxiety, or ADHD problem that is actually causing more impairment.

### Family

Take the correction out of the room. Parents reduce tic severity more by changing their response than by reminding. Siblings need a script. Schools need a short letter neurology is willing to stand behind.

### Parent training

No punishment for tics. No reward that requires tic-free hours, which the child cannot guarantee. Praise the competing response if you are using one. Ignore the tic the family agreed to stop commenting on. Coach the adult who comments the most.

## Intake questions

- Which tics, for how long, and which one actually impairs school or friends?
- What do adults do when the tic happens?
- Any ADHD, OCD, anxiety, or rage episodes?
- Has neurology seen the child, and is anyone asking you to medicate?

## Differentials

- Tics versus compulsions versus stereotypies versus seizures versus functional tic-like events. The treatment differs. Neurology helps when the phenomenology is unclear.
- ADHD treatment can sometimes affect tics. That is a prescriber observation, not a reason for you to stop a stimulant.
- "Behavior" in class versus a tic plus an adult correction cycle.

## Modifications

- Do not draw attention to the tic during the session unless you are doing a CBIT exercise the child agreed to.
- Do not treat a waxing week as failure of the child.
- Match CBIT demands to developmental level. A competing response is a motor skill. Break it down.
- Use the tics material in the additional-topics training.

## Sources

- [Tourette Association of America — CBIT](https://tourette.org/research-medical/cbit-overview/) — Overview of Comprehensive Behavioral Intervention for Tics.
- [Tourette Association of America](https://tourette.org/) — Family education on tic disorders and co-occurring conditions.
- [American Academy of Pediatrics](https://www.aap.org/) — Pediatric context. Confirm local neurology pathways before you teach medicine decisions.

id: type-1-diabetes
title: Type 1 diabetes
summary: Daily insulin, glucose data, and family conflict are the clinical material. Mood and "not listening" can be a glucose problem.
group: Endocrine
order: 10
completeness: full
statusBadge: Draft - pending medical team review

## Overview

Type 1 diabetes is an autoimmune loss of the cells that make insulin. The child needs insulin from outside the body to survive. It is not caused by eating sugar, and it is not type 2 diabetes. Families often have to say that out loud more than once, including to relatives and to school staff.

Care is a stream of decisions: dose, food, activity, illness, devices, and sleep. Endocrine owns the insulin plan, the glucose targets, and the technology. CSC's work is the behavioral and family side of living with that plan. You do not adjust doses, set a target range, or tell a family which pump settings to use.

Who is supposed to do which task changes with age. Distress often gets labeled noncompliance when it is fear, burnout, a skill the child does not have yet, or a number that was never going to be stable that day. Ask which task breaks down before you agree with the label.

## Key treatments

Insulin is given by injections or by a pump, on a plan the endocrine team writes. Some youth use a hybrid closed-loop system that adjusts insulin from a continuous glucose monitor. The system still needs a human. Sites fail, sensors fall off, and algorithms do not know about a soccer game or a skipped lunch.

Glucose is watched with a meter, a continuous glucose monitor, or both. Alarms, especially overnight, are part of the treatment and part of the exhaustion. Ketones are checked during illness or when glucose stays high, on the schedule the team taught the family.

Meals usually involve carbohydrate counting and a mealtime dose. Some younger children are on a more fixed food plan. Severe lows are treated with the fast sugar or glucagon product the team prescribed. You should know the family has a plan. You should not invent one.

School needs a written plan: who gives insulin, where supplies live, which staff are trained, and what happens on a field trip. If that plan is missing, the gap belongs on the problem list next to any behavior goal.

## Treatment burden

There is no day off. Meals, sports, sleepovers, exams, and sick days all need a plan. Night checks and alarms break sleep for the child and for the caregivers. Caregivers of young children carry the whole cognitive load. Adolescents may look independent on paper and still miss the lunch dose when no one is watching.

Technology reduces some of the work and adds alarms, skin problems, failed sites, and a device on a body that may not want to be seen. Insurance and supply orders are part of the illness. Siblings often get less attention. Conflict clusters around numbers, because the number is visible and the fear underneath it is not.

## Adherence

Adherence is a poor word for a task that is never finished. Ask which piece breaks down: the lunch bolus at school, wearing the sensor, checking ketones, guessing carbohydrates, or running high on purpose.

Diabetes distress is common. It is not the same thing as a primary depressive disorder, and both can be present. Fear of hypoglycemia leads some families to run high. That is a safety strategy with its own costs. Do not dismantle it without endocrine.

Insulin omission tied to weight or shape is a medical emergency pattern, seen more often in adolescence. It needs endocrine and, usually, an eating-disorder resource. It does not need a shame-based sticker chart. Using insulin to self-harm is a same-day safety issue.

Adolescents pull back from parent help before the skills are solid. Negotiate a specific handoff for one task this month. "You're old enough" is not a plan.

## Mental health and development

Depression, anxiety, and diabetes distress are more common than in peers. Screen for them. Do not assume every hard day is a psychiatric disorder, and do not assume it is "just diabetes" either.

Family conflict about glucose is one of the strongest behavioral patterns linked to trouble. Treat the conflict. A child who is scolded for every number learns to hide the number.

Needle fear and site-change fear are ordinary, especially early, and they are treatable with graded practice alongside the nursing plan. Young children cannot manage independently. A tantrum at a check may be developmental, plus pain, plus a frightened adult. School-age children can own a piece: wash hands, tell an adult they feel low, carry supplies. The adult still doses unless endocrine has said otherwise.

Teens are managing privacy, driving, sports, alcohol, dating, and the wish to be ordinary. Risk-taking can include silencing alarms or skipping insulin. Say that plainly, without a speech about future complications.

Hypoglycemia and hyperglycemia mimic mood and attention problems. A child who is irritable, slow, tearful, or "not listening" may be out of range. Ask what the glucose was at the time. Sleep loss from alarms mimics depression and ADHD.

## Long-term effects

Years of high glucose raise the risk of eye, kidney, and nerve complications. That conversation belongs to endocrine. Do not use complications as a threat in therapy. Severe hypoglycemia and diabetic ketoacidosis are the acute dangers. Hypoglycemia unawareness can develop, which is why some families are so afraid of lows. Repeated severe lows and ketoacidosis, especially in young children, are also a reason the medical team thinks about learning and development. You support prevention. You do not deliver the prognosis talk.

Eating disorders and insulin omission drive both acute ketoacidosis and longer-term harm. Name the pattern early and bring endocrine in.

## Red flags

These are reasons to reach the medical team or emergency care, not topics to hold for next session.

- Signs of diabetic ketoacidosis: vomiting, stomach pain, fast or deep breathing, fruity breath, sleepiness, confusion. This is emergency care.
- Severe hypoglycemia: seizure, unconsciousness, or inability to swallow. Emergency care. Glucagon only as the family has already been taught.
- Insulin omission, running very high on purpose, or any use of insulin to self-harm.
- New disordered eating, or fear of insulin tied to weight.
- Suicidal ideation or self-harm of any kind, using your usual safety pathway and telling endocrine.
- A family so burned out that doses are not happening and endocrine does not know.
- Anyone asking you what number to bolus. Send them back to the on-call endocrine line. Do not guess.

## Therapy implications

### Individual

Name diabetes distress as a response to an unrelenting task. Map one breakdown, such as lunch doses at school, rather than a goal to "be more compliant."

If fear of lows is running the family's numbers, build a graded plan only inside the range endocrine has already set. Do not invent a glucose goal that sounds reasonable.

For body image and insulin omission, stay collaborative and non-shaming, and loop in the medical team early. Device wear is a practical problem: sports, skin, being seen. Rule out skin injury with nursing before you treat it as pure avoidance.

When mood is the referral, ask whether symptoms cluster with highs, lows, or alarm nights before you treat them as a separate psychiatric disorder. Offer concrete scripts for friends, coaches, and teachers. A teenager often needs the sentence more than the insight.

### Family

Move glucose out of a moral argument ("you don't care") and into a shared plan. Parents' fear is information. It is also exhausting to live with. Put the monitoring conflict on the table: what the caregiver checks, what the young person will show, and what happens when the number is bad.

Decide who does what this month and write it down, matched to developmental level. Include sibling and partner strain. Align the adults so the child does not live under two regimens.

### Parent training

Make checks and site changes short, predictable, and as calm as the day allows. Practice when no one is scared, not only in the crisis. Catch the child doing a skill and name that skill. Do not punish numbers. Numbers are data.

For young children, the caregiver does the task. The child's job is a small piece: choosing a finger, holding a supply, sitting. For teens, coach the parent from lecturing toward a pre-agreed check-in. Build a night plan that a human can keep. Ask the family to show you the endocrine rule for when to call, and practice that rule. Do not write a new one.

## Intake questions

- What was the glucose around the last few episodes of irritability, fatigue, or "not listening"?
- Who does which task this month: checks, doses, site changes, supplies, and the school plan?
- Where is the fight: numbers, food, devices, sleep, or independence?
- Any missed insulin, fear of weight gain, or hiding the number?
- What do alarms do to sleep for the child and the caregivers?

## Differentials

- Irritability, tearfulness, or aggression versus hypoglycemia or hyperglycemia. Get the glucose from that afternoon before you build a behavior plan.
- Inattention versus glucose variability versus sleep loss from alarms versus a separate ADHD diagnosis. The ADHD question can stay open. It should not be settled first.
- Depression versus diabetes distress versus burnout. They overlap and they are not identical.
- Restricted eating for weight, restricted eating from fear of carbohydrates and insulin, and ARFID-type restriction are different problems with different medical risk.
- Oppositional behavior versus a demand the child cannot yet do, such as counting carbohydrates or feeling a low in their body.

## Modifications

- A session during a low is not a therapy session. Keep the family's fast sugar in the room if they want it there, and follow their plan.
- Do not do fingersticks, and do not give insulin advice.
- One diabetes task at a time. Include the caregiver who actually does that task.
- For adolescents, split the hour: time alone and time together. Say the split out loud.
- If the late-day problem is the referral, ask them to bring the CGM or meter record, not only the story.

## Sources

- [American Diabetes Association — Standards of Care in Diabetes](https://professional.diabetes.org/standards-of-care) — Updated yearly. Includes psychosocial care and pediatric considerations. Confirm the current edition before you quote a target.
- [American Diabetes Association — life with diabetes](https://diabetes.org/) — Family-facing explanations of type 1, technology, and safety.
- [ISPAD clinical practice consensus guidelines](https://www.ispad.org/resources/ispad-clinical-practice-consensus-guidelines.html) — International pediatric diabetes guidance, including psychological care and diabetes in adolescence.
- [Society of Pediatric Psychology](https://pedpsych.org/) — Professional home for pediatric psychology practice and consultation.
