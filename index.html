`),n=(t===-1?e:e.slice(0,t)).trim(),i=t===-1?``:e.slice(t+1);r.set(n,vr(i))}for(let e of[`Individual`,`Family`,`Parent training`])if(!r.get(e)?.length)throw Error(`${t}: therapy section "${e}" is empty.`);return{individual:r.get(`Individual`)??[],family:r.get(`Family`)??[],parentTraining:r.get(`Parent training`)??[]}}function Dr(e,t){let n=Tr(e);if(!n.length)throw Error(`${t}: add at least one source.`);return n.map(e=>{let n=e.match(/^\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)\s*(?:[—–-]\s*(.*))?$/);if(!n)throw Error(`${t}: source must be [Name](https://...) — note. Got: ${e}`);return{name:n[1]??``,url:n[2]??``,detail:(n[3]??``).trim()}})}function Or(e,t=`condition`){let{meta:n,body:r}=Cr(e),i=n.id??``;if(!i)throw Error(`${t}: id is required.`);let a=wr(r);for(let e of xr)if(!a.has(e))throw Error(`${i}: missing section "${e}".`);if(n.statusBadge!==Sr)throw Error(`${i}: statusBadge must be exactly "${Sr}".`);if(n.completeness!==`full`&&n.completeness!==`stub`)throw Error(`${i}: completeness must be full or stub.`);let o=vr(a.get(`Overview`)??``),s=vr(a.get(`Key treatments`)??``),c=vr(a.get(`Treatment burden`)??``),l=vr(a.get(`Adherence`)??``),u=vr(a.get(`Mental health and development`)??``),d=vr(a.get(`Long-term effects`)??``),f=vr(a.get(`Red flags`)??``),p=Er(a.get(`Therapy implications`)??``,i),m=Tr(a.get(`Intake questions`)??``),h=Tr(a.get(`Differentials`)??``),g=Tr(a.get(`Modifications`)??``);if(!m.length||!h.length||!g.length)throw Error(`${i}: intake questions, differentials, and modifications need items.`);let _={id:i,title:n.title??i,summary:n.summary??``,group:n.group??`Other`,order:Number(n.order??0),completeness:n.completeness,statusBadge:n.statusBadge,reviewer:n.reviewer??``,reviewDate:n.reviewDate??``,systems:(n.systems??``).split(`,`).map(e=>e.trim()).filter(Boolean),trainingIds:(n.trainingIds??``).split(`,`).map(e=>e.trim()).filter(Boolean),overview:o,keyTreatments:s,treatmentBurden:c,adherence:l,mentalHealthDevelopmental:u,longTermEffects:d,redFlags:f,therapy:p,intakeQuestions:m,differentials:h,modifications:g,sources:Dr(a.get(`Sources`)??``,i),searchText:``};return _.searchText=[_.title,_.summary,_.group,..._.systems,yr(o),yr(s),yr(c),yr(l),yr(u),yr(d),yr(f),yr(p.individual),yr(p.family),yr(p.parentTraining),...m,...h,...g,..._.sources.map(e=>e.name)].join(` `).toLowerCase(),_}var kr={intro:`These cases are invented for teaching. They are not real patients and not a competency test. Nothing you click is saved. Talk the feedback through with your supervisor.`,items:[{id:`anxiety-only`,title:`Worry before school`,vignette:`Jordan is 10 and was referred by the pediatrician for worry and stomachaches on school mornings. There is no chronic medical diagnosis, no developmental difference, and no request for ABA. Jordan is keeping up in class. The family tried one community counselor, did not like the fit, and wants Children's Specialty Care because the hospital feels safer. The stomachaches resolve once the school day starts. Primary care found no medical cause.`,questions:[{id:`fit`,prompt:`How does this referral sit against the scope of service?`,choices:[{id:`pain`,label:`Likely eligible. Morning stomachaches are a chronic pain disorder, so Path 1 is met.`,fit:!1,feedback:`A stomachache that tracks school and has no chronic pain diagnosis is not the scope's chronic pain disorder. Path 1 is for diagnoses such as a chronic pain disorder with an evidence base for behavioral treatment, named as such. This story is anxiety, which is Condition A only.`},{id:`no`,label:`Not eligible. Anxiety without a developmental difference, a chronic medical condition, or age under 6 does not meet Path 2, and community mental health is the right level.`,fit:!0,feedback:`This matches the scope. Condition A is present. Condition B is not. Path 1 is not. The exclusion for needs that traditional community mental health can meet also fits. A bad first counselor is a reason to try again in the community, not a reason to open CSC. Do not submit a BH23 referral to CSC from these facts.`},{id:`hospital`,label:`Likely eligible, because any referral that starts inside the hospital system belongs to CSC.`,fit:!1,feedback:`Where the family hopes to be seen is not a criterion. The scope is about the child's age, the diagnosis, and whether specialty care is actually required.`}]},{id:`younger`,prompt:`What changes if Jordan is 4 years old and the rest of the story is the same?`,choices:[{id:`nothing`,label:`Nothing. Anxiety is anxiety at any age, so the answer stays not eligible.`,fit:!1,feedback:`Age under 6 is one way to meet Condition B. A 4-year-old with a real anxiety disorder can meet Path 2 even without autism or a chronic illness. You still ask whether traditional community care can meet the need. Many community clinics are a poor fit for a preschooler, which is why the scope names very young age.`},{id:`b`,label:`Condition B can now be met by age. Eligibility depends on whether this preschooler's anxiety truly needs specialty care rather than a community provider who works with young children.`,fit:!0,feedback:`Yes. Under 6 meets Condition B when Condition A is present. It is not an automatic yes: if a community clinician who treats young children can do the work, the exclusion still applies. If not, CSC is in range, and a pediatrician would use the BH23 Counseling box and answer Yes to the supplemental question.`},{id:`aba`,label:`Now the referral should be routed to high-hour ABA, because the child is under 6.`,fit:!1,feedback:`Young age is not an ABA referral. High-hour ABA is an excluded service. Under 6 is an inclusion route for specialty therapy at an ordinary dose, usually with a large caregiver role.`}]}],takeaway:`Read Path 1 narrowly. Morning stomachaches are not automatically a chronic pain disorder. Then read Condition B carefully: under 6 changes the math, and a learning disability or a preference for the hospital does not.`,related:[{label:`Open the screener`,to:`/screener`},{label:`Developmental lens, under 6`,to:`/development/under-6/typical`}]},{id:`bh23-routing`,title:`Which box on BH23`,vignette:`Luis is 9 and has encopresis with constipation, followed in GI. He also has ADHD. The family is not asking for ABA. GI is ready to refer for behavioral treatment of the encopresis alongside the bowel plan. A year ago the pediatrician also mentioned counseling. You are helping the referring clinician place the BH23 referral today, and the person entering it is the GI provider.`,questions:[{id:`box`,prompt:`Which BH23 path fits this referral?`,choices:[{id:`counseling`,label:`Counseling box, and answer Yes to the question about age or developmental complexity.`,fit:!1,feedback:`That is the path for providers who are not in a specialty clinic. GI is a specialty clinic. The person entering this referral is the GI provider, so the specialty box is the one the scope names.`},{id:`specialty`,label:`Check the "MB Specialty referral to CSC" box.`,fit:!0,feedback:`Yes. Specialty Care Clinic providers refer through BH23 and check the MB Specialty referral to CSC box. Encopresis is a Path 1 diagnosis, so the referral can fit even before you sort out ADHD. ADHD alone would not have been enough without a developmental difference, a chronic medical condition, or age under 6.`},{id:`both`,label:`Check both the specialty box and the Counseling box so the referral is not lost.`,fit:!1,feedback:`The scope names one path based on who is referring. Checking both is not the instruction and can send the referral to the wrong queue. One box: MB Specialty referral to CSC.`}]},{id:`pediatrician`,prompt:`Same child, same encopresis, but the pediatrician is the person entering the referral. GI is involved and is not the one submitting it.`,choices:[{id:`still-specialty`,label:`Still the specialty box, because a specialist follows him.`,fit:!1,feedback:`Routing follows who submits the referral, not who else is on the team. The pediatrician is not a specialty clinic provider.`},{id:`counseling-yes`,label:`Counseling box, and answer Yes to "Is this child 0-5 years or 6-17 with developmental complexity."`,fit:!0,feedback:`Yes. All other providers use the Counseling box and answer Yes to that supplemental question. The question's wording is about age and developmental complexity. The scope still says to answer Yes, including when the child qualifies on Path 1 — here, encopresis — without a developmental difference. Do not talk yourself out of the Yes because Luis is 9 and the qualifying piece is the bowel diagnosis rather than autism.`},{id:`no-refer`,label:`Do not refer. Encopresis plus ADHD can be handled in community mental health.`,fit:!1,feedback:`Encopresis is on the scope's Path 1 list of medical diagnoses with evidence-based behavioral treatment. It is not 'just counseling' that any community clinic is assumed to provide. The bowel plan stays with GI or pediatrics. CSC's work sits beside that plan.`}]}],takeaway:`Path 1 and the BH23 box answer different questions. Encopresis can make the child eligible. The box depends on who is typing the referral. When that person is not in a specialty clinic, answer Yes to the supplemental question even if the wording fits a developmental story better than a bowel story.`,related:[{label:`Open the screener`,to:`/screener`},{label:`Encopresis card`,to:`/conditions/encopresis`},{label:`Additional topics training`,to:`/training/additional`}]},{id:`afternoon-anger`,title:`Angry after lunch`,vignette:`Sam is 14, has type 1 diabetes, and is followed in Endocrine. Caregivers asked for help with anger and not listening in the late afternoon. A teacher wonders about ADHD. Language and learning are otherwise typical for age. No one has looked at the glucose record from those afternoons. Sam uses a CGM and sometimes silences alarms at school. The family wants a behavior plan they can start this week.`,questions:[{id:`first`,prompt:`What is the right first step?`,choices:[{id:`adhd`,label:`Start an ADHD evaluation protocol. The teacher has already identified the problem.`,fit:!1,feedback:`The teacher may be seeing something real, and ADHD can coexist with diabetes. It is the wrong first move while late-day irritability has not been set next to the glucose record. Stimulant decisions and attention labels can wait a step.`},{id:`glucose`,label:`Ask what the glucose was around the irritable episodes. Hold hypoglycemia, hyperglycemia, sleep loss from alarms, and medication effects beside an ADHD question, and loop in Endocrine.`,fit:!0,feedback:`Yes. Irritability versus hypo- or hyperglycemia is a standing differential in diabetes. A behavior plan aimed at 'not listening' can punish a low. Ask Endocrine what pattern they see and what they want the family to do when the number is out of range. Keep ADHD on the list. Do not crown it on day one. The recorded training on the ADHD differential sits in Additional topics; the illness content sits in Chronic Illness.`},{id:`teen`,label:`Decline the referral. Anger in the afternoon is ordinary adolescence.`,fit:!1,feedback:`Adolescence is part of the formulation and is not a reason to wave off a diabetes-linked behavior change. Endocrine referred a real regimen problem. CSC's job is to sort medical mimics from skills, family conflict, and possible ADHD — not to declare teens moody and close the chart.`}]},{id:`adapt`,prompt:`Sam's skills are typical for 14. Which way of working fits the developmental lens?`,choices:[{id:`lecture`,label:`Give a detailed lecture on complications so the afternoon anger has consequences Sam can respect.`,fit:!1,feedback:`Fear of future complications is a poor lever and is not yours to invent. Typical adolescents can think abstractly and still decide from shame, friends, and fatigue. A lecture also skips the glucose question.`},{id:`coach`,label:`Give Sam part of the session alone. Write one concrete stuck point — late-day checks or boluses — and move the caregivers from nagging toward a check-in they agreed to.`,fit:!0,feedback:`That matches a typical adolescent adaptation: privacy that is real, one stuck point, and a caregiver who coaches instead of doing the task or delivering a speech. Concreteness still matters when Sam is irritable or low. Look at the Developmental lens for the adolescent, Typical pace, if you want the longer version.`},{id:`parent-only`,label:`See only the caregivers. At 14, the patient's report will be unreliable.`,fit:!1,feedback:`Caregivers are essential and they are not the whole client. A typical 14-year-old can say what happens at school when alarms go off, if you offer time without an audience. Excluding Sam will look like the same surveillance Sam is already fighting.`}]}],takeaway:`In diabetes, mood and 'not listening' are glucose questions until the record says otherwise. Then adapt the hour to the developmental level you actually have: here, a typical adolescent, not a generic child and not a small adult.`,related:[{label:`Type 1 diabetes card`,to:`/conditions/type-1-diabetes`},{label:`Adolescent lens, typical pace`,to:`/development/adolescent/typical`},{label:`Chronic illness training`,to:`/training/chronic-illness`}]}]},Ar={intro:`Use this when you are about to change the way you talk, the size of the task, or how much of the hour belongs to the caregiver. Pick the stage that matches the child's age, then set the pace to where skills actually are. Ahead means gifted or highly capable. Behind means the child needs more support than same-age peers. The scope's age rule 'under 6' covers birth through 5. This lens splits that span in two, because therapy with an infant is not therapy with a 4-year-old.`,functionalOverview:`Some behaviors make sense when you ask what they do for the child, not what they say about character. The usual functions are getting attention or connection, escaping a demand or a sensation, getting an item or activity, and meeting a sensory need directly. Watch what happens just before and just after. Teach a replacement the child can already almost do. CSC does not provide high-hour ABA. This is a way to think during an ordinary therapy hour, not a prescription for a many-hour program.`,paces:[{id:`ahead`,label:`Ahead`,hint:`Gifted or highly capable`},{id:`typical`,label:`Typical`,hint:`Skills near age expectations`},{id:`behind`,label:`Behind`,hint:`Needs more support than same-age peers`}],domains:[{id:`cognition`,label:`Cognition`},{id:`language`,label:`Language`},{id:`perspective`,label:`Perspective taking`},{id:`socialEmotional`,label:`Social and emotional`}],adaptations:[{id:`concreteness`,label:`Concreteness`},{id:`visuals`,label:`Visuals`},{id:`caregiver`,label:`Caregiver role`},{id:`taskBreakdown`,label:`Task breakdown`},{id:`functionalBehavior`,label:`Functional view of behavior`}],stages:[{id:`infant-toddler`,title:`Infant and toddler`,ages:`Birth to about 2 years`,summary:`The work is co-regulation, routines, and reading behavior as communication. Explanations do not land yet.`,intakeQuestions:[`What does a hard stretch of the day actually look like, from the minutes before it starts?`,`How does the child show hunger, pain, fatigue, and overload — and how quickly does an adult respond?`,`Who is with the child for most of the day, and what does that person already do that helps?`],domains:{typical:{cognition:`Learns by looking, mouthing, dropping, and doing a thing again. Lives in the present. Later and tomorrow do not organize behavior yet.`,language:`Moves from cries and sounds to gestures and first words, then short combinations. The behavior is the sentence.`,perspective:`Shares attention on a face or a toy. Does not hold your reasons in mind or take your point of view.`,socialEmotional:`Regulation happens in the relationship. A steady adult body is the intervention. Separation, hunger, pain, and fatigue look like behavior problems if you are not watching the body.`},ahead:{cognition:`May be unusually alert, fast to map a routine, or early with words or motor problem-solving. Thinking speed does not create emotional age. Do not add a curriculum because the child seems bright.`,language:`Words may arrive early and still fail under distress. A toddler who talks well can have no words left during a medical procedure or a separation.`,perspective:`May notice adult emotions quickly and try to please or clown. That is not the same as understanding why an adult is scared or angry.`,socialEmotional:`Intensity is common: big joy, big frustration, a long time to come down. Giftedness at this age is often uneven. Sleep, sensory load, and caregiver exhaustion belong in the formulation.`},behind:{cognition:`Responses may be slower, harder to elicit, or tightly tied to one sensory channel. Use the channel that works. Do not interpret a delay as ignoring you.`,language:`Fewer sounds, gestures, or words than peers. Treat any consistent signal — a look, a reach, a sound — as communication worth answering.`,perspective:`Joint attention may be fragile. Get into the child's focus instead of insisting they enter yours. Screens and busy rooms make this worse.`,socialEmotional:`Harder to console does not mean the relationship is failing. Rule out hearing, vision, pain, reflux, and seizures with the medical team before you build a behavior story. Partner with early intervention; do not replace it.`}},adaptations:{typical:{concreteness:`Do the thing. Do not explain it. Narrate with a few words while it happens: shoes on, then outside.`,visuals:`Real objects beat pictures. One picture can preview a single next step, such as a diaper, a chair, or bye.`,caregiver:`The caregiver is in the work as much as the child. Coach in the room. You cannot hand a toddler a coping skill to use alone.`,taskBreakdown:`One action, then stop. Wait longer than feels natural before you help.`,functionalBehavior:`Watch what the adult does in the seconds after a cry, a hit, or a drop. Ask what the child gets, or gets away from. Teach a simpler signal the child can almost do, such as a reach or a sound you answer every time.`},ahead:{concreteness:`Follow the child's interest, then return to one concrete step. Early language is not a reason to lecture.`,visuals:`A two-step picture card can work if the child already uses symbols. Keep it to the next thing, not the whole day.`,caregiver:`Caregivers may need permission to stop stimulating a very alert child. Recovery time is part of the plan. Intensity in the child often lands as exhaustion in the adult.`,taskBreakdown:`The child may race ahead and then fall apart. Break the task anyway. Speed is not stamina.`,functionalBehavior:`A bright toddler can still use a behavior because it works. Do not assume they should know better. Name the function in plain words for the caregiver and change what happens right after.`},behind:{concreteness:`Fewer words. More doing. Hand the object. Touch the location. Repeat the same short phrase every time.`,visuals:`Objects first. If pictures are used, one picture, high contrast, and check that vision and hearing have been looked at.`,caregiver:`Coach one caregiver skill per visit. Ask what early intervention or therapies are already teaching so you do not contradict them.`,taskBreakdown:`Shrink the step until the child succeeds with a small amount of help, then fade the help. Success has to be visible to the caregiver.`,functionalBehavior:`Count a signal as a behavior worth reinforcing: a look, a lean, a sound. The replacement has to be physically possible. If the child cannot yet point, do not make pointing the plan.`}}},{id:`under-6`,title:`Under 6`,ages:`About 3 to 5 years`,summary:`Play is the main language. Thinking is concrete, one thing at a time, and easily pulled into magic or guilt. Caregivers still do the regulating.`,intakeQuestions:[`What does the child do in play when no one is directing it?`,`Which feelings have words, and which feelings only show up in the body or in hitting?`,`What does the caregiver do in the first minute of a meltdown, and what happens to the meltdown?`],domains:{typical:{cognition:`Thinks in the here and now. One idea at a time. Cause and effect is shaky, so medical events easily become 'I did something bad.' Rules are literal.`,language:`Sentences are longer, but abstract words — worry, forever, fair — are unreliable. Under stress, language drops back to gestures and no.`,perspective:`Around 4 and 5, a simple guess about someone else's feeling becomes possible and then disappears when the child is scared or ashamed. Do not count on it during a procedure or a scolding.`,socialEmotional:`Feelings are big and fast and often show in play, sleep, eating, and the body. The caregiver is still the regulator. Peer play is emerging and falls apart without an adult nearby.`},ahead:{cognition:`May ask adult questions, remember detailed explanations, and spot inconsistencies. Magical guilt can be more elaborate, not less. A precise explanation can create a new fear.`,language:`Vocabulary can look years older than the child's ability to use it while upset. Do not conduct the session at the level of their best sentence.`,perspective:`May talk about other people's feelings in a grown-up way and still be unable to act on that talk. Insight is not a skill.`,socialEmotional:`Perfectionism, intense interests, and existential questions ('Will you die?') show up early. Peers may be confusing because the child wants both baby play and adult talk. Emotional recovery is often the lagging piece.`},behind:{cognition:`Stay with one concrete idea. Multi-step 'if then' plans will not hold. Check understanding by having the child show you, not by asking 'okay?'`,language:`Shorter utterances, more scripts, or more behavior than words. Match your sentences to theirs and add one word, not a paragraph.`,perspective:`Do not require the child to imagine how a parent or sibling feels. That demand often produces shame or a memorized answer.`,socialEmotional:`Regulation skills may look like a younger child. Use play, sensory supports, and the caregiver's body. Keep toys and examples dignified for a preschooler, not an infant, unless the child seeks infant play.`}},adaptations:{typical:{concreteness:`One idea. Tie it to something they can see or do in the room. Skip metaphors, or explain the metaphor as if it were new.`,visuals:`A first-then card, a feelings picture with few faces, or the actual object. Draw the plan together if they like to draw.`,caregiver:`Teach the caregiver the phrase and the routine. The child will not carry it home alone. Spend part of the hour coaching the adult while the child plays.`,taskBreakdown:`Two steps at most: first this, then that. Practice the calm version before you practice the hard version.`,functionalBehavior:`Keep an ABC on one behavior for a week, not a diary of everything. Guess the function with the caregiver. The replacement might be a word, a picture, or a break chair. Practice it when everyone is calm.`},ahead:{concreteness:`Answer the real question briefly and accurately, then land on one thing to do. Do not pile on mechanisms. Offer the interesting fact after the plan is in place, not instead of it.`,visuals:`This child may reject 'baby charts.' Make the visual look like a tool a big kid would use: a short list, a map of the visit, a drawing they invent.`,caregiver:`Help the caregiver stop over-explaining. The adult's job is to shrink the moment, not to win the debate. Permission to be simple is often the intervention.`,taskBreakdown:`They may insist they already understand. Ask them to teach the plan back in three steps or less. Understanding the whole hospital is not the task.`,functionalBehavior:`A gifted preschooler can describe a function and still repeat the behavior because it works. Keep the consequence change small and consistent. Do not turn the functional analysis into a conversation they perform for praise.`},behind:{concreteness:`Show it. Do it together. Use the same words every time. Abstract feeling names can wait.`,visuals:`Photos of their own people and places beat generic cartoons. One picture at a time.`,caregiver:`Most of the hour is caregiver coaching. The child joins for a short, successful practice. Ask what speech, OT, or early intervention is already using.`,taskBreakdown:`Cut the skill into the smallest piece that can be praised today. Going to the clinic door may be the whole goal.`,functionalBehavior:`Match the replacement to communication they actually have. If words fail, a gesture or a picture is the plan. Look for pain, constipation, hunger, and sensory overload before you call it a function — medical discomfort masquerades as behavior at this age.`}}},{id:`school-age`,title:`School age`,ages:`About 6 to 11 years`,summary:`Rules, fairness, and being good at things matter. They can sequence and compare, and they still need concrete examples when the topic is illness, shame, or fear.`,intakeQuestions:[`What is happening at school — learning, friends, attendance, and what adults do when the day goes badly?`,`What does the child say the problem is, in their words, separate from the caregiver's story?`,`Where does the child still need an adult to do the skill with them, even if they look independent?`],domains:{typical:{cognition:`Can hold a sequence, compare two ideas, and use rules. Abstract words still need a concrete example. Under stress, thinking drops back to one thing at a time.`,language:`Can talk about feelings with support and still agrees just to end the conversation. Ask them to say it back. Jokes and slang appear. Shame shuts language down.`,perspective:`Can imagine a simple other point of view and struggles with mixed feelings ('Mom is kind and Mom is too much'). Fairness is concrete: same rules, same turns.`,socialEmotional:`Self-esteem ties to doing things well and to friends. Illness, soiling, tics, or devices can become a secret. They watch whether adults are disappointed.`},ahead:{cognition:`May grasp explanations meant for older students, including odds and mechanisms. Insight can outrun emotional control. A detailed understanding of an illness can feed anxiety rather than settle it.`,language:`Talks like an older child and may still need feeling words modeled. Watch for debating as a way to avoid a feeling or a demand.`,perspective:`Can take several perspectives in conversation and then miss them entirely in a conflict with a parent or a sibling. Do not treat verbal empathy as mastery.`,socialEmotional:`Perfectionism, boredom, and existential worry show up beside immature recovery. Peers may find the child intense. Being 'the smart one' becomes a problem when the body or the behavior does not cooperate.`},behind:{cognition:`Use strategies you would use with a younger child, and keep the topics age-respectful. One idea per sentence. Reading level and listening level may not match. Check the school plan so you are not reteaching a skill someone else owns.`,language:`Shorter sentences, more concrete words, more time to answer. A quick 'yes' is not understanding. Devices, speech-generating tools, or pictures may be the real language — use them in session.`,perspective:`Do not ask them to imagine how the caregiver feels as a way to change behavior. That request is often too hard and lands as shame. Teach a visible rule instead.`,socialEmotional:`Friends and dignity matter even when skills are younger. Do not use babyish materials. Name what the child is good at. Behavioral overflow is more likely when the demand is past their actual skill.`}},adaptations:{typical:{concreteness:`Pair every abstract idea with a specific example from school or home. 'Be brave' is not a plan. 'Tell the nurse you need a minute, then count ten bricks' is a plan.`,visuals:`A short written sequence, a calendar of the medical week, a 1-to-5 scale they help design. Let them keep a copy.`,caregiver:`The child can do part of the session alone. The caregiver still changes the after-effect at home. Agree on one adult response and write it down before they leave.`,taskBreakdown:`Three steps is plenty. Practice the middle step, which is usually the one that fails. Check it the next visit before you add anything.`,functionalBehavior:`The child can help guess the function if you keep the choices concrete: were you trying to get help, get out of it, or get something? Track one behavior. Change what adults do afterward, and teach a sentence or a break card they can use at school.`},ahead:{concreteness:`Offer the real explanation they are asking for, in accurate words, then reduce it to one action. Do not use complications of the illness as a threat to motivate behavior.`,visuals:`Skip cutesy charts if they feel insulting. A one-page plan, a graph they help interpret, or a checklist they designed will be used. Visuals are still useful when anxiety is high and words flood.`,caregiver:`Coach the adult to stop the debate. Agree on a time-limited check-in rather than ongoing surveillance. Protect unstructured time so the child is not only a project.`,taskBreakdown:`They may want a comprehensive system. Make the first week deliberately small. Boredom with repetition is real; vary the example, not the number of new skills.`,functionalBehavior:`They can over-explain the function and still not do the replacement. Write the replacement in one line. Look for escape from boredom or from a demand that feels beneath them, and for attention that only arrives when something goes wrong.`},behind:{concreteness:`Demonstrate, then do it together, then have them show you. Abstract feeling conversations can be a few minutes, not the whole hour.`,visuals:`Picture sequence, first-then, or their communication system. Keep it uncluttered. Do not add a token board that contradicts what the school or ABA team is already doing — ask first.`,caregiver:`The caregiver carries the plan. The child practices a short piece. Spend more of the hour on adult coaching than on talk therapy with the child.`,taskBreakdown:`Shrink until the child is successful with little help. Praise the piece that happened. Do not add a second skill because the caregiver is worried about five problems.`,functionalBehavior:`Assume the skill is missing before you assume the child is refusing. The replacement must be something they can do on a bad day, not only in your office. If a high-hour ABA team is already involved, align with them. CSC does not take over that program.`}}},{id:`adolescent`,title:`Adolescent`,ages:`About 12 years through high school`,summary:`Abstract thought is uneven, especially under stress, fatigue, or a developmental difference. Privacy, peers, and fairness about independence are the clinical material. The caregiver shifts from doing the task to coaching it.`,intakeQuestions:[`What does the young person want from this, separate from what the adults want?`,`Which parts of the medical regimen are they doing, which parts is a caregiver still doing, and where is the fight?`,`What are peers, school, driving, dating, or leaving home doing to the plan this year?`],domains:{typical:{cognition:`Can think about possibilities, identity, and risk, and then decide from the feeling in the room. Fatigue, pain, shame, and friends in the doorway all knock thinking back to concrete and immediate.`,language:`Abstract conversation is available and is a poor measure of what they will do on a Friday night. Ask for the specific situation. Sarcasm and silence are both communication.`,perspective:`Can imagine what others think, sometimes too much (everyone is watching). Can also argue a parent's view and still experience a limit as humiliation. Mixed feelings are nameable with help.`,socialEmotional:`Identity, privacy, and peers carry more weight than adult approval. Illness routines collide with the wish to be ordinary. Risk-taking can include skipping medicine, hiding symptoms, or driving while unwell.`},ahead:{cognition:`May out-reason the adults and still have a younger emotional recovery. Existential questions about prognosis, fairness, and the future are clinical material, not attitude. Do not match their intellect with more data than they asked for.`,language:`Debate can be the defense. Agree on a time to think out loud and a time to choose one action. Precise language matters. So does a plain sentence when they are flooded.`,perspective:`Can hold multiple perspectives, including the medical team's, and use that skill to hide distress. Ask what they have not told anyone. Do not assume social insight means social ease.`,socialEmotional:`Asynchronous development is the usual story: ideas ahead of sleep, friends, or self-care. Perfectionism and despair sit close together when the body does not match the mind. Boredom with basic coping is real. The basic plan may still be the right plan.`},behind:{cognition:`Abstract talk about identity and risk will float past them if the skill level is younger. Use concrete rules, rehearsed situations, and a short list. Chronological age still governs privacy, topics, and tone. No baby talk.`,language:`Shorter language, more time, and a communication method that is theirs. Check back by having them explain the plan. A nod is not informed agreement.`,perspective:`Do not use guilt about a parent's fear as the lever. They may not be able to take that perspective, and it damages trust. State the safety rule and the reason in one or two sentences.`,socialEmotional:`Puberty, peer exposure, and wanting independence are still happening. Build a plan that gives a real piece of control. Caregivers often stay in a younger role too long, or drop out too fast. Name which one you are seeing.`}},adaptations:{typical:{concreteness:`Even when they can think abstractly, make the plan concrete: who does what, on which days, and what happens if it falls apart. Write it. Distress drops the ability to improvise.`,visuals:`A shared note, a phone reminder they agree to, or a one-page plan. Avoid public charts that expose the illness to peers. Ask where the visual will be seen.`,caregiver:`Move the adult from doing the task to coaching it, on a named piece of the regimen only. Give the young person part of the session alone. Say the split out loud so privacy is real.`,taskBreakdown:`One stuck point, not the whole illness. Rehearse the wording they will actually use with a nurse, a teacher, or a friend.`,functionalBehavior:`Collaborate. Do not do a behavior plan to them. Function still matters when the story is attitude: skipping a treatment may be escape from being seen as sick, not ignorance. Change the conditions and the adult response. Keep dignity in the room.`},ahead:{concreteness:`Respect the question, answer it accurately, and do not drown them in mechanisms. End with a decision small enough to do this week. Offer reading only if they want it and the medical team is comfortable with the source.`,visuals:`A written plan they edit is often better than a worksheet. Graphs of their own data can help if the data will not be used to shame them. Ask first.`,caregiver:`Help the caregiver survive not winning the argument. A scheduled check-in beats surveillance. Watch for a parent who has become the debate partner and has no warmth left in the room.`,taskBreakdown:`They will propose a complex system. Negotiate down to the step that fails under stress, not the step that fails when they are at their best.`,functionalBehavior:`Intellectualizing is often escape. Name that kindly, then return to what the behavior gets them in the real situation. The replacement has to work when they are tired or ashamed, not only when they are articulate.`},behind:{concreteness:`Short, literal, repeatable. Practice in the room. Abstract metaphors about the future will not hold the plan.`,visuals:`Use the communication system they already have. A picture or a three-icon sequence can carry a medical routine. Keep it private if peers would see it.`,caregiver:`The caregiver remains central, and the young person still gets a voice on something real. Coach the adult in front of them when you can, so the plan is not a secret about them.`,taskBreakdown:`One step of the regimen. Fade help on that step only. Do not confuse age with readiness to manage a disease alone.`,functionalBehavior:`Look for escape from demands that are past their skill, and for attention that only comes during a crisis. The replacement might be a card, a script, or a caregiver cue, not a insight. If a community ABA program is in place, stay in your lane and align.`}}}]},jr={intro:[`Use this when you are deciding whether a referral fits Children's Specialty Care, and which BH23 box to use if it does. BH23 is the behavioral health referral named in the scope of service.`,`The age window runs from birth through 18 years, or through completion of high school, whichever comes later. A 17-year-old who already graduated is still inside the window. An 18-year-old who is still in high school is still inside the window. An 18-year-old who has finished high school is not.`,`There are two ways in. Path 1 is a medical diagnosis with an evidence base for behavioral treatment. Path 2 is a mental health or behavioral disorder that needs specialty care because of a developmental difference, a chronic medical condition, or age under 6.`,`Two exclusions sit on top of both paths: therapies that take many hours a week, such as ABA programs, and mental health needs that traditional community mental health can meet. A learning disability alone is not a developmental difference.`,`There is no place to type a name, date of birth, or story. Pick categories only. Refreshing the page clears your answers.`],agePrompt:`How old is the child?`,ageHelp:`Under 6 also meets Condition B when a mental health or behavioral disorder is present. You do not need a separate developmental diagnosis for that age rule.`,ageOptions:[{id:`under6`,label:`Birth to 5 years`,detail:`Under age 6.`},{id:`6to17`,label:`6 to 17 years`,detail:`Inside the age window whether or not high school is finished.`},{id:`18plus`,label:`18 years or older`,detail:`The window stays open only if high school is not yet completed.`}],highSchoolPrompt:`Has high school been completed?`,highSchoolHelp:`The scope ends at the later of the 18th birthday or high-school completion. If you are not sure, the result will be a consult rather than a yes or no.`,highSchoolOptions:[{id:`no`,label:`No — high school is not completed`,detail:`Still enrolled, or the diploma or equivalent is not finished.`},{id:`yes`,label:`Yes — high school is completed`,detail:`This closes the age window.`},{id:`unsure`,label:`Not sure`,detail:`Confirm enrollment before anyone submits a referral.`}],abaPrompt:`Is this a request for high-hour therapy, such as an ABA program?`,abaHelp:`The scope excludes therapies that require many hours a week. A functional look at behavior inside an ordinary therapy hour is not the same thing as an ABA program. If the family is asking CSC to provide the many-hour service, this exclusion applies.`,abaOptions:[{id:`yes`,label:`Yes — they are asking for many hours a week`,detail:`ABA or a similar high-hour program.`},{id:`no`,label:`No — this is a therapy-hour request`,detail:`Individual, family, or parent training at a usual outpatient dose.`},{id:`unsure`,label:`Not sure what intensity they want`,detail:`Ask before you route the referral.`}],path1Prompt:`Does the child have a medical diagnosis with an evidence-based behavioral treatment?`,path1Help:`The scope says these diagnoses may include the ones below. A diagnosis on this list can qualify on its own. It does not also need a developmental difference. If the diagnosis is something else, do not force it onto this list — mark the last option and CSC can say whether a behavioral treatment evidence base exists.`,path1Options:[{id:`tics`,label:`Tic disorders`},{id:`encopresis`,label:`Encopresis`},{id:`enuresis`,label:`Enuresis`},{id:`fnd`,label:`Functional neurological disorder`},{id:`chronic-pain`,label:`Chronic pain disorders`},{id:`chronic-fatigue`,label:`Chronic fatigue`},{id:`other`,label:`A different medical diagnosis, and I need CSC to say if it belongs here`},{id:`none`,label:`None of these`}],conditionAPrompt:`Is there a mental health or behavioral disorder?`,conditionAHelp:`Condition A is the mental health or behavioral disorder. The scope's examples are below. Another disorder still counts. This is Path 2. Skip nothing just because Path 1 already matches — both can be true, and the formulation is better when you name them.`,conditionAOptions:[{id:`disruptive`,label:`Disruptive behavior`},{id:`adhd`,label:`ADHD`},{id:`anxiety`,label:`Anxiety`},{id:`depression`,label:`Depression`},{id:`trauma`,label:`Trauma`},{id:`adjustment`,label:`Adjustment to illness`},{id:`other-mh`,label:`Another mental health or behavioral disorder`},{id:`none`,label:`No mental health or behavioral disorder`}],devPrompt:`Is there a developmental difference?`,devHelp:`Condition B can be met by a developmental difference. Autism, gifted or highly capable, and intellectual disability count. A learning disability alone does not. If you are unsure the difference is more than a learning disability, mark the unsure option rather than stretching a category.`,devOptions:[{id:`autism`,label:`Autism spectrum`},{id:`gifted`,label:`Gifted or highly capable`},{id:`intellectual-disability`,label:`Intellectual disability`},{id:`other-dev`,label:`Another developmental difference, and it is not a learning disability alone`,detail:`CSC should confirm this one. It does not automatically qualify.`},{id:`learning-disability`,label:`Learning disability`,detail:`Does not count as a developmental difference by itself.`},{id:`none`,label:`None of these`}],medicalPrompt:`Is there a chronic medical condition?`,medicalHelp:`Condition B can also be met by a chronic medical condition. The scope's examples are below. Another chronic condition can count. Chronic pain is on this list and on Path 1. If the referral is for behavioral treatment of the pain disorder itself, mark it under Path 1 as well.`,medicalOptions:[{id:`chronic-pain`,label:`Chronic pain`},{id:`sci`,label:`Spinal cord injury`},{id:`seizure`,label:`Seizure disorder`},{id:`cp`,label:`Cerebral palsy`},{id:`tbi`,label:`Traumatic brain injury`},{id:`other-chronic`,label:`Another chronic medical condition`,detail:`The scope's list is examples. Confirm it is chronic and that it shapes the need.`},{id:`none`,label:`No chronic medical condition`}],communityPrompt:`Can traditional community mental health meet this need appropriately?`,communityHelp:`The scope excludes mental health issues that traditional community services can address. Answer from the specialty question, not from whether a slot is open nearby. Path 1 diagnoses (tics, encopresis, enuresis, functional neurological disorder, chronic pain, chronic fatigue) usually need the behavioral treatment, not a general counseling referral. If you are unsure, say so.`,communityOptions:[{id:`no`,label:`No — this needs CSC's specialty focus`,detail:`Developmental difference, chronic medical condition, very young age, or a listed medical diagnosis with a behavioral treatment.`},{id:`yes`,label:`Yes — community mental health is the right level of care`,detail:`The need does not require CSC.`},{id:`unsure`,label:`Not sure`,detail:`This is a consult, if the inclusion paths otherwise fit.`}],referrerPrompt:`Who is making the referral?`,referrerHelp:`Routing follows the person who submits it, not which path matched. A pediatrician uses the Counseling box even when a specialist also follows the child, unless the specialty clinic provider is the one placing the referral.`,referrerOptions:[{id:`specialty`,label:`A Specialty Care Clinic provider`,detail:`Oncology, Hematology, Neurology, Pulmonology, Endocrine, PM&R, Developmental Behavioral Pediatrics, GI, or another specialty clinic.`},{id:`other`,label:`Any other provider`,detail:`Pediatrician, OT, speech, PT, audiology, community clinicians, and anyone who is not a specialty clinic provider.`}],outcomes:{eligible:{title:`Likely eligible`,headline:`These answers fit the scope of service.`},"not-eligible":{title:`Not eligible`,headline:`These answers do not fit the scope of service.`},consult:{title:`Needs a consult`,headline:`Do not submit yet. A CSC consult should settle the open question.`}},routing:{eligiblePreface:`Referral routing follows who is referring, not which path matched.`,consultPreface:`If CSC accepts the referral, route it this way.`,specialty:{title:`Specialty Care Clinic provider`,steps:[`Refer through BH23.`,`Check the "MB Specialty referral to CSC" box.`],note:`Use this only when the person entering the referral is a Specialty Care Clinic provider.`},other:{title:`All other providers`,steps:[`Refer through BH23.`,`Use the "Counseling" box.`,`Answer Yes to the supplemental question: "Is this child 0-5 years or 6-17 with developmental complexity."`],note:`The supplemental question is worded around age and developmental complexity. The scope still tells every non-specialty provider to answer Yes, including when the child qualifies on Path 1 (for example encopresis) without a developmental difference.`}},closings:{eligible:`This is decision support for the scope of service, not a coverage decision and not a chart note. Confirm anything uncertain with CSC before the referral is submitted.`,consult:`Bring the open question to CSC. Do not guess the box and do not enter patient details into this tool while you wait.`,age:`The age window is closed. CSC is not the next step for this referral.`,aba:`CSC does not provide high-hour ABA or similar many-hour programs. That request belongs with an ABA or other high-hour provider, not with CSC.`,community:`Traditional community mental health is the closer fit. Do not submit a CSC referral from these answers.`,criteria:`The inclusion paths were not met. Do not submit a CSC referral from these answers.`}},Mr={universal:[`Who lives with the child, and who actually carries the medical or behavioral tasks on a hard day?`,`What does a hard episode look like from the minutes before it starts until the minutes after it ends?`,`What has the family already tried, and what do they not want repeated?`,`What would better look like in the next month, in something you could see or count?`,`How is school or childcare going: attendance, learning, friends, and the adults who help?`,`What should shape the work: language, culture, faith, food, family rules, and who is allowed to hear what?`,`Who is on the medical team, and how does the family reach them after hours?`,`Are there safety concerns the medical team or a supervisor needs today: self-harm, not eating or drinking, abuse, or a symptom the family was told is an emergency?`],groups:[{id:`specialty`,label:`Specialty clinic`,sources:[{id:`oncology`,label:`Oncology`,detail:`Cancer and blood and marrow transplant programs.`,trainingIds:[`chronic-illness`],questions:[`Where is the child in treatment: active therapy, maintenance, finished treatment, relapse, or survivorship?`,`Are corticosteroid pulses on the calendar, and do mood, sleep, or aggression track those weeks?`,`What has the team said about school, infection limits, and activity — in their words, not a general guess?`,`What does the child know about the illness, and what words does the family use?`],differentials:[`Irritability, aggression, or sleep collapse during a steroid pulse is a medicine effect until shown otherwise. It can also be pain, fear, or a separate mood disorder. Ask oncology before you treat it as a new primary psychiatric illness.`,`Inattention or slow schoolwork after brain tumor treatment, cranial radiation, or intrathecal chemotherapy may be a neurocognitive late effect, fatigue, hearing loss, or seizures — not only motivation or ADHD.`]},{id:`hematology`,label:`Hematology`,detail:`Sickle cell disease, hemophilia, and other blood disorders.`,trainingIds:[`chronic-illness`],questions:[`What is the home plan for pain or a bleed, and when is the family told to go to the emergency department?`,`For sickle cell disease: any history of stroke, silent infarct, or a neuropsychological concern the school does not know?`,`Which medicine is hard to take (hydroxyurea, factor, or another), and what gets in the way — taste, access, distrust, side effects, or a schedule that does not fit the day?`,`Has the family been disbelieved about pain before? What would make this hospital feel different?`],differentials:[`Pain crises, silent stroke, and fatigue can look like behavior, school refusal, or depression. Ask hematology what has already been ruled out.`,`A bleed into a joint or muscle can look like refusal to walk or to participate. That is a medical question first.`]},{id:`neurology`,label:`Neurology`,detail:`Seizures, tics, headache, and other neurologic diagnoses.`,trainingIds:[`additional`],questions:[`What seizure type has neurology named, when was the last event, and what does the written rescue plan say?`,`Could spells of staring or 'not listening' be absence seizures rather than inattention?`,`Which medicines changed in the last few months, and did behavior, mood, or appetite change with them?`,`If functional neurological symptoms are on the table: what has neurology already said is functional, and what still needs urgent evaluation?`],differentials:[`ADHD symptoms versus absence seizures versus medication side effects. Do not settle an attention diagnosis while spells, a new medicine, or sleep loss are unexamined. Ask neurology which medicine is the likely behavioral culprit rather than guessing.`,`Tics versus compulsions versus stereotypies versus seizure. The treatment is different. Suppression by punishment is not a treatment.`]},{id:`pulmonology`,label:`Pulmonology`,detail:`Cystic fibrosis and other chronic lung disease.`,trainingIds:[`chronic-illness`],questions:[`What does the daily regimen include now: airway clearance, inhaled medicines, enzymes, modulators, oxygen, or feeds?`,`Which piece is skipped, who notices, and what does the conflict sound like?`,`Have mood, sleep, or anxiety changed since a modulator was started or changed? The CF team needs to hear that. Do not stop a medicine from the therapy room.`,`What infection precautions does this clinic use, and how isolated does the child feel from other children with the same illness?`],differentials:[`Low mood or irritability after a modulator change may be the medicine, a sleep problem, or depression. Report it. Do not decide alone.`,`Cough, breathlessness, chest pain, or coughing blood is a pulmonary emergency pattern, not an anxiety story, until the CF or pulmonary team says otherwise.`]},{id:`endocrine`,label:`Endocrine`,detail:`Diabetes and other hormone conditions.`,trainingIds:[`chronic-illness`],questions:[`Who makes dose decisions, and what is the young person actually doing at school versus what the plan says?`,`Do irritability, fatigue, or 'not listening' cluster with low glucose, high glucose, or alarm-interrupted nights?`,`Is there fear of lows, shame about numbers, or conflict at every check?`,`Any insulin omission, skipping meals, or worry about weight? Tell endocrine. Do not hold that for a later session.`],differentials:[`Irritability, tearfulness, or aggression versus hypoglycemia or hyperglycemia. Ask what the glucose was around the episode before you build a behavior plan.`,`Inattention versus glucose variability versus sleep loss from alarms versus a separate ADHD diagnosis versus thyroid or other hormone effects. Endocrine should help sort the medical pieces.`]},{id:`pmr`,label:`PM&R`,detail:`Physical medicine and rehabilitation, including brain injury, spinal cord injury, and cerebral palsy.`,trainingIds:[`dev-complexity`],questions:[`What equipment, spasticity treatment, or pain plan is in place, and what is the child afraid of?`,`For spinal cord injury: does the family know the warning signs of autonomic dysreflexia, and do they have a written plan?`,`What can the child do independently that adults still do out of habit?`,`What has PT, OT, or speech asked behavioral health not to contradict?`],differentials:[`Refusal to participate versus pain, fatigue, autonomic symptoms, or a task that is physically impossible today.`,`New weakness, headache with flushing and sweating, or a change from neurologic baseline is a medical review, not a motivation problem.`]},{id:`dbp`,label:`Developmental Behavioral Pediatrics`,detail:`Autism, developmental delay, and complex developmental diagnoses.`,trainingIds:[`dev-complexity`],questions:[`Which developmental diagnoses are established, which are suspected, and which reports should you read before the second visit?`,`What therapies are already in place, for how many hours, and is anyone asking CSC to provide ABA?`,`How does the child communicate best when they are upset, including any device or pictures?`,`What does the caregiver want changed, and does the child have a way to show you that goal?`],differentials:[`A request for high-hour ABA is outside CSC's scope even when autism and a behavioral disorder are both present.`,`Aggression or self-injury versus pain, constipation, seizures, sleep loss, or a communication system that fails under stress.`]},{id:`gi`,label:`GI`,detail:`Gastroenterology, including inflammatory bowel disease, constipation, and feeding.`,trainingIds:[`feeding`],questions:[`What diagnosis is actually on the chart — for example IBD versus IBS, retentive constipation versus something else — and what is the bowel or nutrition plan?`,`What is the stool pattern, the soiling pattern, and what has the family been told to do for cleanout?`,`What is the range of foods, the fear of eating or of bathrooms, and which foods matter culturally that a plan must not casually remove?`,`Are there tube feeds or supplements, and how does the family feel about them?`],differentials:[`Soiling versus willful behavior. Overflow encopresis is a medical bowel problem with shame attached. Behavioral work supports the bowel plan. It does not replace it.`,`Restricted eating versus ARFID versus inflammatory symptoms versus cultural food practices versus a body-image eating disorder. These are not the same treatment.`]}]},{id:`therapies`,label:`Pediatric therapies`,sources:[{id:`ot`,label:`Occupational therapy`,detail:`Fine motor, sensory, daily routines, and participation.`,trainingIds:[`dev-complexity`],questions:[`What has OT asked behavioral health to work on, and what is OT already treating?`,`Which daily routines fail: dressing, meals, toothbrushing, classroom tolerance, or devices on the body?`,`What sensory pattern does OT describe, and what happens when that pattern is ignored in a behavior plan?`],differentials:[`Noncompliance versus a motor or sensory demand the child cannot meet in the time allowed.`,`Device refusal (a vest, a splint, a CGM) versus skin injury or pain that nursing should see.`]},{id:`speech`,label:`Speech-language pathology`,detail:`Communication, AAC, and feeding or swallowing.`,trainingIds:[`dev-complexity`,`feeding`],questions:[`How does the child communicate, including any AAC, and do you have access to that system in session?`,`What does frustration look like when they are not understood?`,`Are there swallowing precautions or food textures speech has cleared or forbidden?`],differentials:[`Ignoring versus not hearing the language, not having the words, or not having the device available.`,`Food refusal versus a swallowing risk. Do not expand the diet past what speech and the medical team have cleared.`]},{id:`pt`,label:`Physical therapy`,detail:`Mobility, pain with movement, and participation.`,trainingIds:[`dev-complexity`],questions:[`What activities are medically restricted, and who set that limit?`,`Is the barrier pain, fear of movement, fatigue, or a behavior that ends the session?`,`What does PT want the family to practice, and what gets in the way at home?`],differentials:[`Avoidance versus pain flare versus cardiac or respiratory limits, especially in Duchenne, advanced lung disease, or deconditioning after a long admission.`,`Fatigue versus refusal. Ask what the medical team counts as a stop sign.`]},{id:`audiology`,label:`Audiology`,detail:`Hearing, devices, and access to spoken language.`,trainingIds:[`dev-complexity`],questions:[`What is the hearing status, what devices are used, and when during the day are they off?`,`Does the session need devices on, a remote microphone, or visual supports to be a fair test of anything?`,`What has the child missed in school because of hearing, and who thinks that is noncompliance?`],differentials:[`Not listening versus not hearing. Check devices before you interpret attention, language, or attitude.`,`Language delay versus hearing loss versus both. Audiology should already be in the story if hearing is a question.`]}]},{id:`primary`,label:`Primary care`,sources:[{id:`pediatrician`,label:`Pediatrician`,detail:`Primary care. Routing uses the Counseling box if a CSC referral goes forward.`,trainingIds:[],questions:[`What has already been tried in the community, and why is specialty care being asked for now?`,`Which specialists are involved, if any, and is a specialty clinic the one that should be placing this referral instead?`,`Is this a request for ordinary counseling that community mental health can provide?`],differentials:[`A primary care referral for anxiety, depression, or behavior without developmental difference, chronic medical complexity, age under 6, or a Path 1 diagnosis often belongs in community mental health. Run the screener before you build a long intake.`,`ADHD symptoms versus absence seizures versus medication side effects versus poor sleep. Ask whether neurology or a medicine change is already in motion.`]}]}],concerns:[{id:`adhd`,label:`ADHD or inattention`,detail:`A behavioral concern. Not a full condition card.`,trainingIds:[`additional`,`aba`],questions:[`Which settings show the problem, and which settings do not?`,`What do sleep, hearing, and the school day actually look like?`,`Is there a medicine already on board that can affect attention or mood?`],differentials:[`ADHD versus absence seizures versus medication side effects. Staring spells, a new antiseizure medicine, or a stimulant started last month can mimic or muddy an attention story. Ask the prescriber and, if spells are present, neurology.`,`Inattention versus sleep loss, pain, low mood, learning disability, or a demand that is past the child's language level.`],modifications:[`One target behavior. A visible cue. A shorter work bout. Do not start a full ADHD protocol on the first visit if a medical mimic is still open.`]},{id:`anxiety`,label:`Anxiety`,detail:`A behavioral concern. Not a full condition card.`,trainingIds:[`dev-complexity`],questions:[`What does the child avoid, and what do adults do when the avoidance starts?`,`Is the fear attached to medical procedures, separation, school, or something the child will not say yet?`,`Any panic symptoms that could be medical: chest pain, fainting, low glucose, breathing difficulty?`],differentials:[`Anxiety versus a medical event that feels like panic: hypoglycemia, a respiratory flare, a cardiac symptom, or a seizure aura. If the body symptom is new or outside the known pattern, the medical team hears it first.`,`Worry versus OCD rituals versus tics. The family may use one word for all three.`],modifications:[`Build a small ladder. Do not start at the scariest medical step. Tell the child the session will end on something they can do.`]},{id:`depression`,label:`Depression or withdrawal`,detail:`A behavioral concern. Not a full condition card.`,trainingIds:[`chronic-illness`],questions:[`What has changed in sleep, interest, energy, and time with friends?`,`Any statements about not wanting to be alive, even jokes? Those go to your safety pathway today.`,`Does the low mood track steroids, uncontrolled pain, poor sleep, or a recent medical setback?`],differentials:[`Depression versus steroid mood effects versus thyroid or other hormone change versus fatigue from the illness itself versus grief.`,`Withdrawal versus hearing loss, language load, or a social world that disappeared during treatment.`],modifications:[`Smaller activation goals. Include the caregiver. Do not use the illness prognosis as a motivational speech.`]},{id:`trauma`,label:`Trauma`,detail:`A behavioral concern. Not a full condition card.`,trainingIds:[`dev-complexity`],questions:[`What does the child or caregiver say happened, in the amount of detail they can manage today?`,`Which reminders are medical: restraint for procedures, ICU, needles, or a parent's panic?`,`Is there a current safety issue, including abuse, that has to be reported?`],differentials:[`Trauma reminders versus a current medical emergency that looks similar: vomiting, fast breathing, dissociation versus seizure or low glucose.`,`Hypervigilance versus a reasonable response to a still-dangerous medical situation. Do not desensitize a child to a symptom they have been told is a warning sign.`],modifications:[`Predictability, choice, and a stop signal. Do not do trauma processing on an intake. Stabilize, and match the dose of talk to developmental level.`]},{id:`disruptive`,label:`Disruptive behavior`,detail:`A behavioral concern. Not a full condition card.`,trainingIds:[`aba`,`dev-complexity`],questions:[`What is the one behavior that most needs to change, in words a stranger could recognize?`,`What do adults do in the next 30 seconds, and what does the child get or get out of?`,`Is anyone asking for a many-hour ABA program? If yes, CSC is the wrong service.`],differentials:[`Disruptive behavior versus pain, constipation, low glucose, a seizure cluster, or a communication breakdown.`,`Defiance versus a skill the child does not have at this developmental level, especially in language or flexibility.`],modifications:[`Change the adult response before you ask the child for a new personality. One replacement skill. Practice it calm.`]},{id:`adjustment`,label:`Adjustment to illness`,detail:`A behavioral concern. Pair it with the condition card when you have one.`,trainingIds:[`chronic-illness`],questions:[`What changed in the last few months in the illness, the family, or the school?`,`What has the child stopped doing that they used to do?`,`What does the family think a therapist can change, and what has to stay in the medical team's hands?`],differentials:[`Adjustment versus a medicine effect, a worsening of the disease, or a developmental shift such as adolescence taking over self-care.`,`Grief versus depression. Both can be present. Neither is fixed by reassurance that other children have it worse.`],modifications:[`Ask what words the family uses for the illness and use those. Do not introduce a battle metaphor they did not choose.`]}]},Nr={name:`CSC Clinical Companion`,org:`Children's Specialty Care`,banner:`Reference tool only. Do not enter any patient information.`,bannerDetail:`Not a medical record and not a referral submission. Nothing you select is saved or sent. Refreshing the page clears the screener and the intake checklist.`,footer:`Draft clinical content, pending medical team review. For Master's-level therapists and interns in Children's Specialty Care.`,modules:[{to:`/screener`,index:`01`,title:`Eligibility and referral`,text:`Walk the scope of service and leave with likely eligible, not eligible, or needs a consult — plus the BH23 box that matches who is referring.`},{to:`/intake`,index:`02`,title:`Intake guide`,text:`Choose the referral source, the condition, and the developmental level. Get a printable list of questions, differentials, and how to adapt the work.`},{to:`/development`,index:`03`,title:`Developmental lens`,text:`Read cognition, language, perspective taking, and social-emotional development by stage, then switch Ahead, Typical, or Behind.`},{to:`/conditions`,index:`04`,title:`Condition cards`,text:`Therapy considerations for the illnesses CS
